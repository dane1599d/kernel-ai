[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agentabi = { path = "../agentabi" }
bpe = { path = "../bpe" }
# Spike S12-2: the real `cc` service runs the model's C (fluency/c.rs).
ccserve = { path = "../ccserve" }
promptcore = { path = "../promptcore" }
cpufeat = { path = "../cpufeat" }
# S05-2's mock trees, counted by `cargo xtask tokens`.
deskcore = { path = "../deskcore", features = ["mock"] }
gguf = { path = "../gguf" }
infer = { path = "../infer" }
diskmap = { path = "../diskmap" }
kaifs = { path = "../kaifs" }
kaimem = { path = "../kaimem" }
kaipkg = { path = "../kaipkg", features = ["online"] }
# The HTTPS mock (mock_https/): its TLS server and test CA (plan p5-networking, task 7).
kainet = { path = "../kainet", features = ["testca"] }
rustls = { version = "=0.23.46", default-features = false }
kabi = { path = "../kabi" }
kaibundle = { path = "../kaibundle", features = ["alloc"] }
livecore = { path = "../livecore" }
editcore = { path = "../editcore" }
gfxcore = { path = "../gfxcore" }
llmproto = { path = "../llmproto", features = ["local"] }
netcore = { path = "../netcore" }
linetable = { path = "../linetable", features = ["alloc"] }
uelf = { path = "../uelf" }
addr2line = { version = "0.27.1", features = ["loader"] }
object = "0.40.0"
quant = { path = "../quant" }
sched = { path = "../sched" }
rustc-demangle = "0.1.28"
# The package repository's test keys (pkgrepo/tuf.rs; ADR 0011 §3).
ed25519-compact = { version = "2.6.0", default-features = false }
getrandom = "0.2.17"
serde_json = "1.0.154"
sha2 = "0.11.1"
# Grain on for the S12-3 comparison (fluency/grain.rs); the OS shell builds without it.
shellcore = { path = "../shellcore", features = ["grain"] }
supervise = { path = "../supervise" }
# The app gate presses a window app's buttons (appgate.rs).
uikit = { path = "../uikit" }
wasmhost = { path = "../wasmhost" }
wit-parser = { version = "=0.262.0", default-features = false, features = ["std"] }
# wit-bindgen's C generator, for `cargo xtask cc-bind` (ADR 0012 D7).
wit-bindgen-c = "=0.63.0"
wit-bindgen-core = "=0.63.0"
semver = "1.0.28"

[dev-dependencies]
# The model download's test plans its job as Models will (P5 task 9).
modelchan = { path = "../modelchan" }
comp-models = { path = "../apps/models" }
# The update disk's test reads its metadata back.
kaituf = { path = "../kaituf" }
updatenet = { path = "../updatenet" }
# The slot disk's tests read its kai-slot 1 back.
bootslot = { path = "../bootslot" }
wat = "1.262.0"
