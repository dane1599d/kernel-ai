[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bpe = { path = "../bpe" }
cpufeat = { path = "../cpufeat" }
gguf = { path = "../gguf" }
infer = { path = "../infer" }
kabi = { path = "../kabi" }
livecore = { path = "../livecore" }
editcore = { path = "../editcore" }
llmproto = { path = "../llmproto", features = ["local"] }
netcore = { path = "../netcore" }
linetable = { path = "../linetable", features = ["alloc"] }
uelf = { path = "../uelf" }
addr2line = { version = "0.27.1", features = ["loader"] }
object = "0.40.0"
quant = { path = "../quant" }
sched = { path = "../sched" }
rustc-demangle = "0.1.28"
serde_json = "1.0.154"
sha2 = "0.11.1"
shellcore = { path = "../shellcore" }
supervise = { path = "../supervise" }
wasmhost = { path = "../wasmhost" }

[dev-dependencies]
wat = "1.262.0"
