[alias]
xtask = "run --quiet -p xtask --"

[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static", "-C", "code-model=kernel", "-C", "force-frame-pointers=yes"]

# Live components: a 64 KiB stack and at most 2 MiB of memory (the host enforces
# the same limit).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=65536", "-C", "link-arg=--max-memory=2097152"]
