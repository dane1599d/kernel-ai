[package]
name = "comp-settings-window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The Settings app in the OS (P4 task 7): `comp-settings`'s model and
# `comp-settings-ui`'s window bound to `kai:ui` (`comp-ui-bind`) and to the
# effects the agent core runs. The app's own actions are `app:settings/actions`.
[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
comp-settings = { path = "../settings" }
comp-settings-ui = { path = "../settings-ui" }
comp-ui-bind = { path = "../ui-bind" }
compsdk = { path = "../../compsdk" }
minicbor = { version = "2.3.0", default-features = false, features = ["alloc", "derive"] }
uikit = { path = "../../uikit" }

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
appabi = { path = "../../appabi" }
livecore = { path = "../../livecore" }
wasmhost = { path = "../../wasmhost" }
