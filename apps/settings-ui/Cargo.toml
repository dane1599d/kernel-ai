[package]
name = "comp-settings-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The Settings app's window as a `kai:ui` tree (ADR 0005 section 4), as
# `comp-notes-ui` is Notes': built whole from the model after each event and
# diffed, with no wasm dependency, so the host tests drive it through `uikit`.
[lib]
doctest = false

[dependencies]
comp-settings = { path = "../settings" }
uikit = { path = "../../uikit" }

[dev-dependencies]
gfx2d = { path = "../../gfx2d" }
sha2 = "0.11.1"
uipaint = { path = "../../uipaint" }
deskcore = { path = "../../deskcore" }
surfabi = { path = "../../surfabi" }
wasmhost = { path = "../../wasmhost" }
look = { path = "../../look" }
