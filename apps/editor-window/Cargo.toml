[package]
name = "comp-editor-window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The editor in the OS (P4 task 11): `editcore::screen` over the granted
# `kai:edit`, drawn by `comp-editor-ui` on `kai:ui` and `kai:code`.
[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
comp-editor-ui = { path = "../editor-ui" }
comp-ui-bind = { path = "../ui-bind" }
compsdk = { path = "../../compsdk" }
editcore = { path = "../../editcore" }
minicbor = { version = "2.3.0", default-features = false, features = ["alloc", "derive"] }
uikit = { path = "../../uikit" }

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
appabi = { path = "../../appabi" }
livecore = { path = "../../livecore" }
wasmhost = { path = "../../wasmhost" }
