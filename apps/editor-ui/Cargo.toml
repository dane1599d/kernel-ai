[package]
name = "comp-editor-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The editor's window (P4 task 11): the tree `kai:ui` and `kai:code` take, built
# from `editcore::screen`'s view. No `kai:ui` calls here, so it is host-tested
# through a real `uikit::Window`.
[lib]
doctest = false

[dependencies]
comp-ui-bind = { path = "../ui-bind" }
editcore = { path = "../../editcore" }
uikit = { path = "../../uikit" }

[dev-dependencies]
gfx2d = { path = "../../gfx2d" }
look = { path = "../../look" }
sha2 = "0.11.1"
uipaint = { path = "../../uipaint" }
deskcore = { path = "../../deskcore" }
surfabi = { path = "../../surfabi" }
wasmhost = { path = "../../wasmhost" }
