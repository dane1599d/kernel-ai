[package]
name = "comp-wait-fixture"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A test fixture for the `wait-reads` boot case (the founder's test 2, item
# 7), never shipped: `wait-window`, a window whose two buttons queue one
# `fs_list` or one `fs_create` as a person's effect, and whose one action says
# what came of each and in which order. Only test images carry it (`xtask`'s
# `components::TEST_ONLY`); a release image refuses to build with it in.
[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
comp-ui-bind = { path = "../ui-bind" }
compsdk = { path = "../../compsdk" }
uikit = { path = "../../uikit" }

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
livecore = { path = "../../livecore" }
wasmhost = { path = "../../wasmhost" }
