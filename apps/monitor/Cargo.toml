[package]
name = "comp-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The System monitor's model (P4 task 9): the processes, CPU and memory it
# shows, the model's state and tokens/s, and the read-only OS rows it asks for
# as effects (ADR 0003 section 4). `no_std` + `alloc` and free of `kai:ui`, so
# the host tests run it as is; the window (`comp-monitor-ui`, then the component)
# draws it. A row's structured result is WAVE text, read with `appabi::wave`.
[lib]
doctest = false

[dependencies]
appabi = { path = "../../appabi" }
