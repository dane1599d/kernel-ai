[package]
name = "gfx2d"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# ADR 0005 §5: Kernel AI's 2D renderer, no_std, for `desktop` and uikit's glue
# in comphost (both on the hard-float ring-3 target). tiny-skia fills, skrifa
# reads outlines and harfrust shapes, all on one read-fonts. The fonts come from
# the caller (boot-bundle files); the tests use assets/fonts/. P3 task 5 (lane
# G-render), measured first in spike S05-1 (#176).
[lib]
doctest = false

[dependencies]
harfrust = { version = "=0.14.0", default-features = false, features = ["libm"] }
libm = "0.2.16"
look = { path = "../look" }
termcore = { path = "../termcore" }
skrifa = { version = "=0.48.0", default-features = false, features = ["libm"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["no-std-float", "simd"] }

[dev-dependencies]
sha2 = "0.11.1"
