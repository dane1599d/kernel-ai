# cargo-about 0.9.2 config for `cargo xtask notices` (ADR 0009 D6). The gate is
# deny.toml; this list only lets cargo-about pick texts: the free class first, so
# it prefers them, then the two approved items.
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "MIT-0", "Unlicense", "BSL-1.0", "Unicode-3.0", "CC0-1.0", "BlueOak-1.0.0", "BSD-2-Clause-Patent", "MPL-2.0", "OFL-1.1"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
