[package]
name = "kainet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# P5's TLS 1.3 and HTTP client (plan p5-networking, tasks 4-6), without std:
# rustls with no default features on a CryptoProvider of our own over the
# RustCrypto primitives, so no C and no assembly enter the shipped graph.
[lib]
doctest = false

[features]
# A test server's signing key (P-256), for xtask's HTTPS mock and the host tests.
server = ["p256/pkcs8"]
# The test certificate authority, for the host only: rcgen needs std.
testca = ["server", "dep:rcgen"]
# Mozilla's root certificates (webpki-roots, CDLA-Permissive-2.0; P5 question 2).
roots = ["dep:webpki-roots"]

[dependencies]
# The shared-suffix list, one for app grants and agent manifests (lane AG).
netdest = { path = "../netdest" }
rustls = { version = "=0.23.46", default-features = false }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc"] }
pki-types = { package = "rustls-pki-types", version = "1.15.1", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
p256 = { version = "0.14.0", default-features = false, features = ["alloc", "ecdh", "ecdsa"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
rsa = { version = "0.9.10", default-features = false, features = ["sha2", "u64_digit"] }
sha2 = { version = "0.11.1", default-features = false }
hmac = { version = "0.13.0", default-features = false }
zeroize = { version = "1.9.1", default-features = false }
httparse = { version = "1.10.1", default-features = false }
# The browser's content codings (plan P6 F-4, `http::coding`): gzip's raw
# deflate through miniz_oxide (MIT OR Zlib OR Apache-2.0, flate2's own Rust
# backend; flate2 itself needs std) with crc32fast (MIT OR Apache-2.0) for its
# CRC-32, and brotli through brotli-decompressor (BSD-3-Clause/MIT, the
# decoding half of brotli 9.1.3), all without std.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
crc32fast = { version = "1.5.2", default-features = false }
brotli-decompressor = { version = "6.4.0", default-features = false }

# Feature `testca` only: never in the OS.
rcgen = { version = "0.14.10", default-features = false, optional = true }
webpki-roots = { version = "1.0.11", optional = true }

[dev-dependencies]
getrandom = "0.3"
# The IPC limit a POST must fit (tests/wire.rs).
kabi = { path = "../kabi" }
kainet = { path = ".", features = ["testca", "roots"] }
# Test bodies coded as a server codes them (tests/exchange.rs): never in the OS.
flate2 = "1.1.10"
brotli = "9.1.3"
