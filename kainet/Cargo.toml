[package]
name = "kainet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# P5's TLS 1.3 and HTTP client (plan p5-networking, tasks 4-6), without std:
# rustls with no default features on a CryptoProvider of our own over the
# RustCrypto primitives, so no C and no assembly enter the shipped graph.
[lib]
doctest = false

[features]
# A test server's signing key (P-256), for xtask's HTTPS mock and the host tests.
server = ["p256/pkcs8"]
# The test certificate authority, for the host only: rcgen needs std.
testca = ["server", "dep:rcgen"]

[dependencies]
rustls = { version = "=0.23.46", default-features = false }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc"] }
pki-types = { package = "rustls-pki-types", version = "1.15.1", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
p256 = { version = "0.14.0", default-features = false, features = ["alloc", "ecdh", "ecdsa"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
rsa = { version = "0.9.10", default-features = false, features = ["sha2", "u64_digit"] }
sha2 = { version = "0.11.1", default-features = false }
hmac = { version = "0.13.0", default-features = false }
zeroize = { version = "1.9.1", default-features = false }

# Feature `testca` only: never in the OS.
rcgen = { version = "0.14.10", default-features = false, optional = true }

[dev-dependencies]
getrandom = "0.3"
kainet = { path = ".", features = ["testca"] }
