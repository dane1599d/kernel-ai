[package]
name = "compsdk"
version.workspace = true
edition.workspace = true
# Programs written for Kernel AI compile it in (ADR 0009 D1).
license = "MIT OR Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
kabi = { path = "../kabi" }
minicbor = { version = "2.3.0", default-features = false, features = ["alloc", "derive"] }

[target.'cfg(target_family = "wasm")'.dependencies]
talc = "5.1.1"
# ADR 0003 section 1: upstream wit-bindgen, no_std and synchronous.
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }
