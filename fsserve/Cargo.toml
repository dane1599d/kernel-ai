[package]
name = "fsserve"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# The `fs` service's logic (ADR 0004 §6-7, P2 task 8): `kai-fs 1` requests on
# `Dir` and `File` badges answered from kaifs. `no_std` + `alloc` over any
# `kaifs::BlockDev`, so `user/src/bin/fs/` runs it over the PART_* calls and the
# host tests over kaifs's in-memory disks.
[lib]
doctest = false

[dependencies]
fsproto = { path = "../fsproto" }
kabi = { path = "../kabi" }
kaifs = { path = "../kaifs", default-features = false }

[dev-dependencies]
kaifs = { path = "../kaifs" }
