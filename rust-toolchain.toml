[toolchain]
# Pinned nightly: the limine and acpi crates need nightly features (docs/decisions.md, M0).
channel = "nightly-2026-10-14"
profile = "minimal"
# rust-src builds core and alloc for the hard-float ring-3 target (-Zbuild-std);
# llvm-tools gives xtask the llvm-objdump that checks the kernel stays soft-float.
components = ["rustfmt", "clippy", "rust-src", "llvm-tools"]
targets = ["x86_64-unknown-none", "wasm32-unknown-unknown"]
