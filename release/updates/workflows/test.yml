# Fetches the published repository with a TUF client, as a device would, and
# fails if it does not verify or would expire within a week (tuf-on-ci 0.21.0).
# Runs after each publish, and on a schedule once `KAI_UPDATES_LIVE` is set.
name: Repository tests

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 4,10,16,22 * * *"

permissions: {}

jobs:
  client:
    # Scheduled runs wait for the first publish (docs/root-ceremony.md, step 5).
    if: github.repository_owner == 'dane1599d' && (github.event_name != 'schedule' || vars.KAI_UPDATES_LIVE == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: theupdateframework/tuf-on-ci/actions/test-repository@662382a8295b89a9d538390ce8b9bb85b207a93d # v0.21.0
        with:
          valid_days: 7

  update-issue:
    needs: [client]
    if: always() && !cancelled() && github.workflow == 'Repository tests'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - uses: theupdateframework/tuf-on-ci/actions/update-issue@662382a8295b89a9d538390ce8b9bb85b207a93d # v0.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          success: ${{ !contains(needs.*.result, 'failure') }}
