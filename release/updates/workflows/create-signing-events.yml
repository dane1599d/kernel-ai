# Opens a signing event for any offline role (root, targets, packages, models)
# close to expiry, so its signers re-sign before devices refuse it
# (tuf-on-ci 0.21.0; re-signing starts 60 days before a 365-day expiry).
name: Create signing events

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  create-signing-events:
    # Scheduled runs wait for the first publish (docs/root-ceremony.md, step 5).
    if: github.repository_owner == 'dane1599d' && (github.event_name != 'schedule' || vars.KAI_UPDATES_LIVE == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the signing event branch
      actions: write # starts the signing-event workflow
    steps:
      - uses: theupdateframework/tuf-on-ci/actions/create-signing-events@662382a8295b89a9d538390ce8b9bb85b207a93d # v0.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  update-issue:
    needs: [create-signing-events]
    if: always() && !cancelled() && github.repository_owner == 'dane1599d'
    runs-on: ubuntu-24.04
    permissions:
      issues: write # a failing run opens or updates an issue
      contents: read
    steps:
      - uses: theupdateframework/tuf-on-ci/actions/update-issue@662382a8295b89a9d538390ce8b9bb85b207a93d # v0.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          success: ${{ !contains(needs.*.result, 'failure') }}
