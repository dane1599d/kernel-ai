# A signing event: a `sign/*` branch that changes metadata or targets. Each
# push checks what the change needs, comments on its pull request and asks the
# signers it waits for (tuf-on-ci 0.21.0). Runs only in dane1599d's repository,
# never in a fork.
name: Signing event

on:
  workflow_dispatch:
  push:
    branches: ["sign/**"]
    paths: ["metadata/**", "targets/**"]

permissions: {}

jobs:
  signing-event:
    if: github.repository_owner == 'dane1599d'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # commits to the signing event branch
      pull-requests: write # the signing event's pull request
      actions: write # starts the next signing-event run
    steps:
      - uses: theupdateframework/tuf-on-ci/actions/signing-event@662382a8295b89a9d538390ce8b9bb85b207a93d # v0.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
