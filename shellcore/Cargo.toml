[package]
name = "shellcore"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agentabi = { path = "../agentabi" }
kabi = { path = "../kabi" }
llmproto = { path = "../llmproto" }
sched = { path = "../sched" }
rhai = { version = "=1.27.0", default-features = false, features = ["no_std", "no_float", "no_custom_syntax", "no_module"] }

[features]
# Rhai Grain, the bytecode VM, for `Exec::Grain` (ADR 0012 D9; off until S12-3 passes).
grain = ["rhai/grain"]
