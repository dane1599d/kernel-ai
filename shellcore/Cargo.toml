[package]
name = "shellcore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agentabi = { path = "../agentabi" }
appabi = { path = "../appabi" }
bootslot = { path = "../bootslot" }
kabi = { path = "../kabi" }
kaigrants = { path = "../kaigrants" }
kaiprofile = { path = "../kaiprofile" }
livecore = { path = "../livecore" }
look = { path = "../look" }
llmproto = { path = "../llmproto" }
promptcore = { path = "../promptcore" }
sched = { path = "../sched" }
termcore = { path = "../termcore" }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.1", default-features = false }
rhai = { version = "=1.27.0", default-features = false, features = ["no_std", "no_float", "no_custom_syntax", "no_module", "internals"] }

[dev-dependencies]
# The `c>` tests run the real `cc` service on the host.
ccserve = { path = "../ccserve" }

[features]
# Rhai Grain, the bytecode VM, for `Exec::Grain` (ADR 0012 D9; off until S12-3 passes).
grain = ["rhai/grain"]
