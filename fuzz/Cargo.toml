[package]
name = "kainet-fuzz"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

# libFuzzer targets for kainet's parsers of server bytes (plan p5-networking
# §6), and for P3's parsers of an app's bytes (plan p3-desktop §1 and §6):
# surfabi's message stream, header page and tree records, and look's
# `kai-theme 1`, whose bodies are surfabi_harness.rs and look_harness.rs, run by
# those crates' hostile tests too; and `desktop`'s readers of other processes'
# bytes (plan p3-desktop §9, P8), deskcore's: the client calls through the desk
# and the shell's and apps' text wires, in desk_harness.rs, run by
# deskcore/tests/hostile.rs too; and what `pkg` and `updated` read from a
# repository and `fs`'s wire (ADR 0000 P8): kaipkg's `.kpkg` reader, kaituf's
# TUF metadata and fsproto's requests and replies, in pkg_harness.rs and
# fsproto_harness.rs, run by kaipkg's and fsproto's fuzz_harness tests too;
# kaimedia's image decoders (P6 groundwork G8), in media_harness.rs, run by
# kaimedia/tests/hostile.rs too; the shell's records on disk (ADR 0000 P8):
# `kai-grants 1` with captable's reader of grant references, and `actlog 1` and
# `2`, in grants_harness.rs and actlog_harness.rs, run by kaigrants's hostile
# test and shellcore's actlog_hostile test too; and an agent package's manifest
# (ADR 0013 section 6), `kai-app 1` with its `agent 1` block, through
# kaiagent's reader, in agent_harness.rs, run by kaiagent's hostile test too.
# Outside the workspace: libfuzzer-sys builds libFuzzer's C++, so these run
# only in .github/workflows/fuzz.yml on a GitHub runner, never on a
# developer's PC. Their bodies are ../fuzz/harness.rs, which kainet's host
# tests also run (kainet/tests/fuzz_harness.rs);
# and kaizip's archive reader (plan P6 M-7), in zip_harness.rs, run by
# kaizip/tests/fuzz_harness.rs too.
#
# Being outside the workspace, this crate is outside `cargo deny`'s graph, so
# its one dependency the workspace lacks is listed here (C's review of #677):
# libfuzzer-sys is "(MIT OR Apache-2.0) AND NCSA", NCSA being libFuzzer's own
# BSD-style licence. It is a test tool on a GitHub runner and never ships.
# serde_json (MIT OR Apache-2.0) is the workspace's, at its version, for
# pkg_harness.rs's index fields and canonical JSON check.
[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
kainet = { path = "../kainet", features = ["testca"] }
kaizip = { path = "../kaizip" }
surfabi = { path = "../surfabi" }
deskcore = { path = "../deskcore" }
look = { path = "../look" }
kaipkg = { path = "../kaipkg" }
kaituf = { path = "../kaituf" }
fsproto = { path = "../fsproto" }
kaigrants = { path = "../kaigrants" }
captable = { path = "../captable" }
shellcore = { path = "../shellcore" }
kaiagent = { path = "../kaiagent" }
agentabi = { path = "../agentabi" }
kabi = { path = "../kabi" }
netdest = { path = "../netdest" }
acpitables = { path = "../acpitables" }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
kaimedia = { path = "../kaimedia" }
rustls = { version = "=0.23.46", default-features = false }
getrandom = "0.3"

[profile.release]
debug = 1

[[bin]]
name = "tls_client"
path = "fuzz_targets/tls_client.rs"
test = false
doc = false
bench = false

