[package]
name = "kaifs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# kaifs, Kernel AI's copy-on-write filesystem (ADR 0004). `no_std` + `alloc`, so
# the same code runs in the ring-3 `fs` service, in `cargo xtask fs` and in host
# tests. The `std` feature (on by default) adds the crash harness; `fs` builds
# with `default-features = false`.
[lib]
doctest = false

[dependencies]
seahash = { version = "4.1.0", default-features = false }
zerocopy = { version = "0.8.63", default-features = false, features = ["derive"] }

[features]
default = ["std"]
std = []
