[package]
name = "uipaint"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# uikit's display list drawn with gfx2d (ADR 0005 sections 4-5): the pixels
# comphost puts in an app window's buffer, and gfx2d's measure for uikit's
# layout. Host-tested against pixel goldens.
[lib]
doctest = false

[dependencies]
gfx2d = { path = "../gfx2d" }
libm = "0.2.16"
look = { path = "../look" }
uikit = { path = "../uikit" }

[dev-dependencies]
sha2 = "0.11.1"
