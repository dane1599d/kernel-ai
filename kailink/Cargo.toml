[package]
name = "kailink"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Links one relocatable Wasm object (tool-conventions Linking.md, as `wcc -c`
# writes it) into a session (ADR 0012 D3-D4). Reads with the wasmparser wasmi
# already ships, and writes with wasm-encoder without its own wasmparser, so one
# parser ships.
[lib]
doctest = false

[dependencies]
wasmparser = { version = "0.228.0", default-features = false }
wasm-encoder = { version = "0.262.0", default-features = false }

[dev-dependencies]
wasmi = { version = "2.0.0", default-features = false, features = ["validate", "portable-dispatch"] }
wasmparser = { version = "0.228.0", default-features = false }
