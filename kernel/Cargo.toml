[package]
name = "kernel"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kernel"
test = false
bench = false

[features]
# Links the Rhai and wasmi spikes into the kernel and runs them at boot (M0 spike).
spikes = ["dep:spike-rhai", "dep:spike-wasmi"]

[dependencies]
acpitables = { path = "../acpitables" }
cpufeat = { path = "../cpufeat" }
kabi = { path = "../kabi" }
limine = "0.6.5"
linetable = { path = "../linetable" }
livecore = { path = "../livecore" }
editcore = { path = "../editcore" }
llmproto = { path = "../llmproto" }
mm = { path = "../mm" }
nvme = { path = "../nvme" }
sched = { path = "../sched" }
termcore = { path = "../termcore" }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
smoltcp = { version = "0.14.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp"] }
virtio-drivers = { version = "0.13.0", default-features = false, features = ["alloc"] }
talc = "5.1.1"
noto-sans-mono-bitmap = { version = "0.3.2", default-features = false, features = ["regular", "size_16", "unicode-basic-latin", "unicode-specials"] }
spin = "0.12.3"
uelf = { path = "../uelf" }
x86_64 = "0.15.5"
# Already in the tree through virtio-drivers; named for the Transport trait's bounds.
zerocopy = { version = "0.8.40", default-features = false }
spike-rhai = { path = "../spikes/rhai", optional = true }
spike-wasmi = { path = "../spikes/wasmi", optional = true }
