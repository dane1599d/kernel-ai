[package]
name = "user"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Ring-3 programs and their runtime, linked at kabi::layout::IMAGE_BASE by link.ld and
# loaded by the kernel from Limine modules. xtask builds llm, probe, vecstress and
# workers for the hard-float x86_64-kai-user.json target (x87, SSE and AVX allowed)
# and the rest for soft-float x86_64-unknown-none.

[lib]
test = false
bench = false

[dependencies]
cpufeat = { path = "../cpufeat" }
infer = { path = "../infer" }
kabi = { path = "../kabi" }
livecore = { path = "../livecore" }
editcore = { path = "../editcore" }
llmproto = { path = "../llmproto", features = ["local"] }
quant = { path = "../quant" }
sched = { path = "../sched" }
supervise = { path = "../supervise" }
shellcore = { path = "../shellcore" }
# Spike S04-1 only (spike/kaifs, never merged).
spike-kaifs = { path = "../spikes/kaifs", default-features = false }
spin = "0.12.3"
talc = "5.1.1"
wasmhost = { path = "../wasmhost" }
