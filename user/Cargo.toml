[package]
name = "user"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Ring-3 programs and their runtime, linked at kabi::layout::IMAGE_BASE by link.ld and
# loaded by the kernel from Limine modules. xtask builds llm, probe, vecstress and
# workers for the hard-float x86_64-kai-user.json target (x87, SSE and AVX allowed)
# and the rest for soft-float x86_64-unknown-none.

[lib]
test = false
bench = false

[dependencies]
appabi = { path = "../appabi" }
bootslot = { path = "../bootslot" }
cpufeat = { path = "../cpufeat" }
infer = { path = "../infer" }
kabi = { path = "../kabi" }
deskcore = { path = "../deskcore" }
surfabi = { path = "../surfabi" }
livecore = { path = "../livecore" }
gfx2d = { path = "../gfx2d" }
look = { path = "../look" }
editcore = { path = "../editcore" }
fsproto = { path = "../fsproto" }
fsserve = { path = "../fsserve" }
kaifs = { path = "../kaifs", default-features = false }
kaibundle = { path = "../kaibundle" }
kaituf = { path = "../kaituf" }
llmproto = { path = "../llmproto", features = ["local"] }
quant = { path = "../quant" }
sched = { path = "../sched" }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.1", default-features = false }
supervise = { path = "../supervise" }
shellcore = { path = "../shellcore" }
spin = "0.12.3"
talc = "5.1.1"
wasmhost = { path = "../wasmhost" }

# tufbench's fixture, signed on the host at build time (build.rs).
[build-dependencies]
ecdsa = { version = "0.17.0", default-features = false, features = ["der"] }
ed25519-compact = { version = "2.6.0", default-features = false }
kaituf = { path = "../kaituf" }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.1", default-features = false }
