[package]
name = "user"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Ring-3 programs and their runtime. Built by xtask for x86_64-unknown-none, linked
# at kabi::layout::IMAGE_BASE by link.ld, and loaded by the kernel from Limine modules.

[lib]
test = false
bench = false

[dependencies]
kabi = { path = "../kabi" }
llmproto = { path = "../llmproto" }
supervise = { path = "../supervise" }
rhai = { version = "1.26.1", default-features = false, features = ["no_std", "no_float", "no_custom_syntax"] }
spin = "0.12.3"
talc = "5.1.1"
