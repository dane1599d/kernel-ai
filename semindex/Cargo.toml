[package]
name = "semindex"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The `search` service's index (ADR 0013 section 4): the chunker, `kai-index 1`
# with its crash-safe append, the keyword and time-filter search the ADR falls
# back to, what is indexed, a vector slot behind a trait, and S13-3's embedder
# (Qwen3-Embedding-0.6B over `infer`) in it. `no_std` + `alloc`, so the service
# and the host tests run the same code; no OS wiring yet.
[lib]
doctest = false

[dependencies]
# The embedder's tokenizer and engine (ours).
bpe = { path = "../bpe" }
# The IEEE CRC-32 each frame of the index file carries.
diskmap = { path = "../diskmap" }
infer = { path = "../infer" }
# `logf` for BM25's IDF and `sqrtf` for a vector's length, with no `std`.
libm = "0.2.16"

[dev-dependencies]
# The tests' generated embedding model (ours).
gguf = { path = "../gguf" }
quant = { path = "../quant" }
