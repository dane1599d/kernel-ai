[package]
name = "infer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Qwen3 inference: config and shape checks, the KV cache, the forward pass and
# greedy generation, plus generated fixture models for tests and xtask.
[lib]
doctest = false

[dependencies]
bpe = { path = "../bpe" }
gguf = { path = "../gguf" }
# expf, sqrtf, powf, sinf and cosf without std (founder-approved, 2026-10-19).
libm = "0.2.16"
quant = { path = "../quant" }

[dev-dependencies]
# Already in the tree through llmproto: the tests parse what the JSON shape decodes.
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
