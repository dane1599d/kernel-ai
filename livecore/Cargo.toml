[package]
name = "livecore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Live components without system calls or WebAssembly, so all of it is tested on the
# host: artifacts, the ledger rules the kernel enforces, and the component host's
# swap, probation and rollback.
[lib]
doctest = false

[dependencies]
appabi = { path = "../appabi" }
kabi = { path = "../kabi" }
sha2 = { version = "0.11.1", default-features = false }
