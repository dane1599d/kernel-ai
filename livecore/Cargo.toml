[package]
name = "livecore"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Live components without system calls or WebAssembly, so all of it is tested on the
# host: artifacts, the ledger rules the kernel enforces, and the component host's
# swap, probation and rollback.
[lib]
doctest = false

[dependencies]
kabi = { path = "../kabi" }
