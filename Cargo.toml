[workspace]
resolver = "3"
members = ["acpitables", "kabi", "kernel", "linetable", "llmproto", "mm", "sched", "shellcore", "supervise", "uelf", "user", "xtask", "spikes/rhai", "spikes/wasmi"]
# Host builds only build the xtask runner; the kernel, user programs and spikes are built by xtask for x86_64-unknown-none.
default-members = ["acpitables", "kabi", "linetable", "llmproto", "mm", "sched", "shellcore", "supervise", "uelf", "xtask"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"

[profile.dev]
panic = "abort"

# Dependencies build optimized even in dev builds: unoptimized wasmi needs more than
# 252 KiB of stack to translate one small function. Our own crates stay unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
panic = "abort"
debug = true
