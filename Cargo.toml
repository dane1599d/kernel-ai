[workspace.package]
# One version for the whole OS (ADR 0009 D7). Updates are ordered by
# release_seq, never by SemVer.
version = "0.1.0-dev"
edition = "2024"
license = "MPL-2.0"

[profile.dev]
panic = "abort"

# Dependencies build optimized even in dev builds: unoptimized wasmi needs more than
# 252 KiB of stack to translate one small function. Our own crates stay unoptimized,
# except wasmhost and the inference engine below.
[profile.dev.package."*"]
opt-level = 2

# wasmi's host-function glue crashes when compiled without optimisation, and its
# generics are instantiated in wasmhost (see wasmhost/src/lib.rs).
[profile.dev.package.wasmhost]
opt-level = 2

# The same for `cc`'s logic, the other crate that defines wasmi host functions.
[profile.dev.package.ccserve]
opt-level = 2

# The inference engine crates at the same level: unoptimised, the Q8_0 matvec runs
# about 100x slower in its AVX2 tier and 15-20x in its baseline, so the
# generated-model tests and `model chat` would crawl. Level 2 matches wasmhost and
# every dependency; level 3 measured no faster for the AVX2 tier. quant also drops
# overflow checks (its sums are bounded by construction) and debug assertions,
# which also turns off Rust's precondition checks inside its unsafe SIMD loads;
# together they cost a third of the speed. Its tests compare exact results.
[profile.dev.package.quant]
opt-level = 2
overflow-checks = false
debug-assertions = false

[profile.dev.package.gguf]
opt-level = 2

# The handle table: a lookup on most system calls (ADR 0001's M1), unoptimised
# the main cost of a handle check over a bit check.
[profile.dev.package.captable]
opt-level = 2

# Checks the boot drive's SHA-256s at every boot, megabytes of them: unoptimised
# in the debug kernel that would take seconds.
[profile.dev.package.kaibundle]
opt-level = 2

# The TUF client: `pkg` and `updated` check a repository's metadata at boot, a
# 1,000-target role of 400 KiB among it (spike S11-1's bench, `test=tuf-bench`).
[profile.dev.package.kaituf]
opt-level = 2

[profile.dev.package.cpufeat]
opt-level = 2

[profile.dev.package.bpe]
opt-level = 2

[profile.dev.package.infer]
opt-level = 2

# kaifs: xtask replays every crash state a case's blklogwrites log allows (P2
# task 9), over 100,000 for 200 file actions, and the `fs` service runs it on
# every request. Its debug assertions and overflow checks stay on.
[profile.dev.package.kaifs]
opt-level = 2

# `desktop`'s drawing, at the level S05-1's spike was measured at: unoptimised,
# a full 1920x1080 composite took 50 ms where its budget is 8 (`desk-perf`, #461).
# Their debug assertions and overflow checks stay on.
[profile.dev.package.gfx2d]
opt-level = 2

[profile.dev.package.deskcore]
opt-level = 2

[profile.release]
panic = "abort"
debug = true

# Live components (wasm32-unknown-unknown): small and reproducible, so the fuel a
# request uses stays the same from build to build.
[profile.component]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = "debuginfo"
panic = "abort"
