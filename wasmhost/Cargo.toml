[package]
name = "wasmhost"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The only crate that uses wasmi. Built at opt-level 2 even in dev builds (see the
# workspace Cargo.toml): wasmi's host-function glue crashes when unoptimised.
[lib]
doctest = false

[dependencies]
appabi = { path = "../appabi" }
kabi = { path = "../kabi" }
livecore = { path = "../livecore" }
surfabi = { path = "../surfabi" }
uikit = { path = "../uikit" }
# portable-dispatch: the default tail-call dispatch grows the native stack with
# every instruction when debug assertions are on, as they are in dev builds.
# The limiter error wasmi does not re-export; the version wasmi pins.
wasmi_core = { version = "=2.0.0", default-features = false }
wasmi = { version = "2.0.0", default-features = false, features = ["validate", "portable-dispatch"] }

[dev-dependencies]
wat = "1.262.0"
