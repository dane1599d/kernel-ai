# kaifs (ADR 0004; P2 lane S-engine): clippy on the host and for the soft-float
# target `fs` ships on, without std; the unit, namespace, undo, GC and hostile
# tests and the golden images; and the crash gates in release builds, with
# their figures in the log. Host only: no VM and no model. Runs on pull requests
# and pushes to main that change kaifs or the lock file, and by hand.
name: kaifs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - kaifs/**
      - Cargo.lock
      - .github/workflows/kaifs.yml
  pull_request:
    paths:
      - kaifs/**
      - Cargo.lock
      - .github/workflows/kaifs.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: kaifs-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kaifs:
    name: kaifs (host)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p kaifs --all-targets -- -D warnings
      - name: Clippy for the soft-float target fs ships on, without std
        run: cargo clippy -p kaifs --target x86_64-unknown-none --no-default-features -- -D warnings
      - name: Unit, namespace, hostile, golden image 1 and the quicker crash gates, in a debug build (overflow checks on)
        run: cargo test -p kaifs --lib --test hostile --test rings --test alloc --test engine --test namespace --test golden --test undo --test gc --test cache
      - name: Every test and crash gate, in release
        run: cargo test --release -p kaifs -- --nocapture --test-threads 2
