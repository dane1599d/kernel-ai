# The release image, built three ways (S09-1): on two fresh runners (`build`,
# runners a and b) and offline from the source tarball (`source`, then
# `offline`, with `--network none`). Not run on its own: release.yml calls it and
# then checks the three are one image, and repro.yml (P6 G50) calls it every
# Monday and names what differs. One copy of the jobs, so the weekly check builds
# exactly what a release builds.
#
# Artifacts, for the caller's later jobs: `build-a` and `build-b`
# (kernel-ai.img.zst, kernel-ai.cdx.json, NOTICES.txt, build.log), `source`
# (kernel-ai-source.tar.zst; release.yml names the asset with its version) and
# `offline` (offline.img.zst, NOTICES.txt, offline.log).
name: Release images

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Where the release build reads its crates, and the offline rebuild mounts the
  # vendored ones, so panic locations and line tables match (decisions.md, S09-1).
  REGISTRY_SRC: /home/runner/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f
  # cargo-cyclonedx, for the SBOM each build runner makes (.github/release/sbom.sh);
  # a called workflow does not see its caller's env. Bump with sbom.yml's.
  CYCLONEDX_VERSION: 0.5.9

# bash -eo pipefail: a step piped through tee fails when its command does.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the release image (runner ${{ matrix.runner }})
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        runner: [a, b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Outputs go outside the checkout: an untracked file would mark the build
      # -dirty and change the image.
      - run: mkdir -p "$RUNNER_TEMP/out" && echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo xtask release-image --out "$OUT/kernel-ai.img" | tee "$OUT/build.log"
      # How full each slot is: one runner, since both build the same bytes. A
      # slot past 80% also gets a warning. This workflow runs on a pull request
      # only through release.yml, so the summary appears on a PR that touches
      # release.yml's path filter (the image's own sources), not on every one.
      - name: Slot fill in the summary
        if: matrix.runner == 'a'
        run: |
          { echo "### Slot fill"; echo; echo '```'; grep '^xtask: slot ' "$OUT/build.log" || echo "(no slot lines in the build log)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep '^xtask: slot .* WARNING' "$OUT/build.log" | while read -r line; do echo "::warning::${line#xtask: }"; done || true
      # The image is gigabytes, most of them kai-data's free space: it travels
      # compressed, and the same zstd on the same bytes writes the same file.
      - run: zstd -19 --single-thread -q --rm "$OUT/kernel-ai.img" -o "$OUT/kernel-ai.img.zst"
      - name: The build left the tree clean
        run: test -z "$(git status --porcelain)"
      # The SBOM (P8 row 5, ADR 0009 D6): one CycloneDX file of every crate, the
      # same bytes on both runners (release.yml's `assemble` compares them). It
      # lists every crate NOTICES.txt does, and each crate's licence is one
      # deny.toml allows.
      - name: The SBOM, checked against NOTICES.txt and deny.toml
        run: |
          cargo install --locked --version "$CYCLONEDX_VERSION" cargo-cyclonedx
          .github/release/sbom.sh "$OUT/kernel-ai.cdx.json"
          # Both runners share a checkout path, so cmp in `assemble` cannot show
          # a path leaking into the file: look for it here.
          if grep -nF -e "$PWD" -e /home/runner "$OUT/kernel-ai.cdx.json"; then
            echo "::error::the SBOM holds a path of this runner"
            exit 1
          fi
          cargo xtask notices --check-sbom "$OUT/kernel-ai.cdx.json"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.runner }}
          path: |
            ${{ env.OUT }}/kernel-ai.img.zst
            ${{ env.OUT }}/kernel-ai.cdx.json
            ${{ env.OUT }}/NOTICES.txt
            ${{ env.OUT }}/build.log

  source:
    name: Source tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - name: Sources, every crate vendored (build-std's too), Limine, and the commit
        run: |
          out="$RUNNER_TEMP/out" && mkdir -p "$out"
          cargo xtask limine
          git rev-parse --short=12 HEAD > COMMIT
          sysroot=$(rustc --print sysroot)
          mkdir -p .cargo-offline
          cargo vendor --locked --versioned-dirs \
            --sync "$sysroot/lib/rustlib/src/rust/library/Cargo.toml" vendor > .cargo-offline/config.toml
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --exclude=./target --exclude=./.git -cf - . target/limine-*/ \
            | zstd -19 --single-thread -q -o "$out/kernel-ai-source.tar.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source
          path: ${{ runner.temp }}/out/kernel-ai-source.tar.zst

  offline:
    name: Rebuild from the source tarball, offline
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source
      - name: Unpack, and install the pinned toolchain for the container to borrow
        run: |
          mkdir src && zstd -dc kernel-ai-source.tar.zst | tar -xf - -C src
          cd src && (rustup show active-toolchain || rustup toolchain install)
          rustup target add wasm32-unknown-unknown
      - name: Build with --network none, crates at the release build's registry path
        run: |
          ws=/home/runner/work/kernel-ai/kernel-ai
          mkdir -p home/.cargo && cp -r ~/.cargo/bin home/.cargo/bin
          sed "s|directory = \"vendor\"|directory = \"$REGISTRY_SRC\"|" src/.cargo-offline/config.toml > home/.cargo/config.toml
          docker pull -q buildpack-deps:noble
          docker run --rm --network none -u "$(id -u):$(id -g)" \
            -e HOME=/home/runner -e CARGO_HOME=/home/runner/.cargo -e RUSTUP_HOME=/home/runner/.rustup \
            -e PATH=/home/runner/.cargo/bin:/usr/bin:/bin -e CARGO_NET_OFFLINE=true \
            -v "$PWD/home/.cargo:/home/runner/.cargo" -v "$HOME/.rustup:/home/runner/.rustup" \
            -v "$PWD/src:$ws" -v "$PWD/src/vendor:$REGISTRY_SRC:ro" -w "$ws" buildpack-deps:noble \
            cargo xtask release-image --out offline.img | tee offline.log
          zstd -19 --single-thread -q --rm src/offline.img -o src/offline.img.zst
          mkdir out && mv src/offline.img.zst src/NOTICES.txt offline.log out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline
          path: out/
