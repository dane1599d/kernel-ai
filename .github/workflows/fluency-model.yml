# The M8 fluency gate on the real model, on GitHub's machine instead of a PC:
# it downloads the pinned qwen3-4b-2507 file named in xtask/models.json, checks
# its SHA-256, runs `cargo xtask fluency --local qwen3-4b-2507` through Kernel
# AI's own engine and uploads the run's jsonl. Started by hand only (Actions tab,
# "Fluency gate on the real model", Run workflow).
name: Fluency gate on the real model

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MODEL_ID: qwen3-4b-2507

jobs:
  fluency:
    name: Fluency gate (qwen3-4b-2507, local engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Show the runner's CPU count, vector features and memory
        run: |
          nproc
          grep -m1 '^flags' /proc/cpuinfo | grep -o -w -E 'avx2|avx512f|avx512bw|avx512_vnni' | xargs echo
          free -g
      - name: Read the pinned file from the catalog
        id: pin
        run: |
          jq -e --arg id "$MODEL_ID" '.models[] | select(.id == $id)' xtask/models.json > "$RUNNER_TEMP/entry.json"
          {
            echo "file=$(jq -r .file "$RUNNER_TEMP/entry.json")"
            echo "sha256=$(jq -r .sha256 "$RUNNER_TEMP/entry.json")"
            echo "url=https://huggingface.co/$(jq -r .repo "$RUNNER_TEMP/entry.json")/resolve/$(jq -r .revision "$RUNNER_TEMP/entry.json")/$(jq -r .file "$RUNNER_TEMP/entry.json")"
          } >> "$GITHUB_OUTPUT"
      - name: Reuse the model file from an earlier run
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kai-models
          key: model-${{ steps.pin.outputs.sha256 }}
      - name: Download the model and check its SHA-256
        env:
          KAI_MODELS: ${{ runner.temp }}/kai-models
          FILE: ${{ steps.pin.outputs.file }}
          SHA256: ${{ steps.pin.outputs.sha256 }}
          URL: ${{ steps.pin.outputs.url }}
        run: |
          mkdir -p "$KAI_MODELS"
          if [ ! -f "$KAI_MODELS/$FILE" ]; then
            curl -fL --retry 3 -o "$KAI_MODELS/$FILE" "$URL"
          fi
          echo "$SHA256  $KAI_MODELS/$FILE" | sha256sum -c -
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run the gate's 50 tasks on the local engine
        env:
          KAI_MODELS: ${{ runner.temp }}/kai-models
        run: cargo xtask fluency --local "$MODEL_ID"
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluency-${{ env.MODEL_ID }}-${{ github.run_id }}
          path: target/fluency/*.jsonl
          if-no-files-found: warn
