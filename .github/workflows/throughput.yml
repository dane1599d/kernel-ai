# Throughput floors (lane S-io): boots `part` (S04-2 on the real PART_* calls,
# 32 MiB each way through `fs`) and `net-throughput` (P5-S2's bar: one bulk
# download through main's virtio-net driver, at 0, 20 and 80 ms of added round
# trip) under KVM, writes their MB/s to the job summary, and fails when a figure
# is under its floor (scripts/throughput_floor.py).
# Not a ci.yml job: it runs on pushes to main and pull requests that change the
# storage path, and by hand (a hand run needs this file on main first; `accel:
# tcg` is the deliberately slow run that shows the floor failing).
name: throughput

on:
  workflow_dispatch:
    inputs:
      accel:
        description: kvm, or tcg for a run the floor must fail
        default: kvm
  push:
    branches: [main]
    paths:
      - kernel/src/net/**
      - kernel/src/net_throughput_tests.rs
      - fsproto/**
      - fsserve/**
      - kaifs/**
      - user/src/bin/fs/**
      - user/src/kaifs.rs
      - kernel/src/part_tests.rs
      - kernel/src/block.rs
      - scripts/throughput_floor.py
      - .github/workflows/throughput.yml
  pull_request:
    paths:
      - kernel/src/net/**
      - kernel/src/net_throughput_tests.rs
      - fsproto/**
      - fsserve/**
      - kaifs/**
      - user/src/bin/fs/**
      - user/src/kaifs.rs
      - kernel/src/part_tests.rs
      - kernel/src/block.rs
      - scripts/throughput_floor.py
      - .github/workflows/throughput.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The floor for each direction, in MB/s. KVM runs of `part` on main measured
  # 13/13, 15/15 and 21/26 MB/s (write/read, 2026-11-16 to 11-18): runner noise
  # alone spans that, so the floor catches a halving, not a few MB/s.
  PART_FLOOR_MBS: "10"
  # A TCG run must fail the floor: run 44386325611 booted `part` under TCG at
  # 2/3 MB/s and failed it, as a hand run with `accel: tcg` does.
  # P5-S2's pass (docs/plans/p5-networking.md section 5): at least 30 MB/s at
  # a 20 ms round trip, with the 1 MiB bulk buffer at shipped settings, on the
  # median of three boots. #1217's run on main's driver: 23.8 MB/s at +0 ms,
  # 32.3 at +20 and 8.2 at +80 (+0 under +20 is a follow-up to look at).
  NET_FLOOR_MBS: "30"
  ACCEL: ${{ inputs.accel || 'kvm' }}

concurrency:
  group: throughput-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ci.yml's `qemu` job (bump its version and SHA-256 with ci.yml's), as this
  # workflow cannot rely on that cache being there:
  # QEMU built from the same pinned tarball once, then restored.
  qemu:
    name: QEMU 11.0.5 (built once, cached)
    runs-on: ubuntu-24.04
    env:
      QEMU_VERSION: "11.0.5"
      QEMU_SHA256: 38a1a09f349660cb0e20b8fe5f224d6a53ec4235eb36f2e33a31e21bb6138147
    steps:
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/qemu
          key: qemu-${{ env.QEMU_VERSION }}-ubuntu-24.04-v1
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build QEMU ${{ env.QEMU_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash .github/actions/qemu/build.sh
      - name: Save QEMU ${{ env.QEMU_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/qemu
          key: qemu-${{ env.QEMU_VERSION }}-ubuntu-24.04-v1
    timeout-minutes: 40

  part:
    name: part throughput
    runs-on: ubuntu-24.04
    needs: qemu
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/qemu
      - name: Allow KVM for the runner user
        if: env.ACCEL == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: qemu
          save-if: false
      - name: Boot part
        env:
          XTASK_CASE: part
        shell: bash
        run: cargo xtask test --accel "$ACCEL" --timeout 600 2>&1 | tee "$RUNNER_TEMP/part.log"
      - name: The floor
        if: always()
        run: >
          python3 -I scripts/throughput_floor.py "$RUNNER_TEMP/part.log" part "$PART_FLOOR_MBS"
          'S04-2 on the real calls: .* write (?P<write>[0-9.]+) MB/s .*read (?P<read>[0-9.]+) MB/s'

  net:
    name: net-throughput
    runs-on: ubuntu-24.04
    needs: qemu
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/qemu
      - name: Allow KVM for the runner user
        if: env.ACCEL == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: qemu-release
          save-if: false
      # A TAP device, not slirp, whose TCP to the guest does not scale its
      # window (spike P5-S2): the host's own TCP at 10.0.2.2, as slirp's
      # gateway is; the case uses ip=static.
      - name: A TAP device at 10.0.2.2 for the guest
        run: |
          sudo ip tuntap add dev kaitap0 mode tap user "$USER"
          sudo ip addr add 10.0.2.2/24 dev kaitap0
          sudo ip link set kaitap0 up
      - name: Serve a 256 MiB blob on port 8765
        run: |
          mkdir -p "$RUNNER_TEMP/www"
          head -c 268435456 /dev/zero > "$RUNNER_TEMP/www/blob"
          python3 -m http.server 8765 --bind 10.0.2.2 --directory "$RUNNER_TEMP/www" > "$RUNNER_TEMP/http.log" 2>&1 &
          sleep 1
      # The added round trip is the host's: netem on the TAP device delays
      # what goes to the guest, so the driver runs as it ships.
      # +20 ms, the floored one, boots three times and its median is floored:
      # #1217's first run measured 32.3 MB/s, too near 30 for one boot on a
      # noisy runner to decide.
      - name: Boot net-throughput at 0, 20 (three times) and 80 ms
        env:
          XTASK_CASE: net-throughput
          XTASK_NETDEV: tap,id=net0,ifname=kaitap0,script=no,downscript=no
        shell: bash
        run: |
          for run in 0 20-1 20-2 20-3 80; do
            rtt="${run%%-*}"
            sudo tc qdisc del dev kaitap0 root 2>/dev/null || true
            if [ "$rtt" != 0 ]; then
              sudo tc qdisc add dev kaitap0 root netem delay "${rtt}ms" limit 100000
            fi
            echo "== round trip +${rtt} ms ($run)"
            cargo xtask test --release --accel "$ACCEL" --timeout 600 2>&1 | tee "$RUNNER_TEMP/net-$run.log"
          done
          sudo tc qdisc del dev kaitap0 root 2>/dev/null || true
      - name: The figures at 0 and 80 ms
        if: always()
        run: |
          for rtt in 0 80; do
            echo "+${rtt} ms: $(grep -h 'net-throughput: .* MB/s' "$RUNNER_TEMP/net-$rtt.log" | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: The floor at 20 ms, on the median of three boots
        if: always()
        run: >
          python3 -I scripts/throughput_floor.py
          "$RUNNER_TEMP/net-20-1.log,$RUNNER_TEMP/net-20-2.log,$RUNNER_TEMP/net-20-3.log"
          "net-throughput +20 ms" "$NET_FLOOR_MBS"
          'net-throughput: [0-9]+ bytes in [0-9]+ ms = (?P<down>[0-9.]+) MB/s'
