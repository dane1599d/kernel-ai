name: Soak

# The 10-minute spawn/exit/sleep storm (M5 exit test). Too slow for every PR, so it
# runs on demand, weekly, and on pull requests that carry the "soak" label.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  storm:
    name: 10-minute storm (${{ matrix.accel }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'soak')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        accel: [kvm, tcg]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Allow KVM for the runner user
        if: matrix.accel == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run the soak cases
        run: cargo xtask soak --accel ${{ matrix.accel }}
