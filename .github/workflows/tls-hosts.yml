# Spike P5-S1 (plan p5-networking §5): kainet's TLS 1.3 client, on our
# RustCrypto provider with webpki-roots, handshakes with the four real hosts P5
# reaches (github.com, the update repository's Pages host,
# release-assets.githubusercontent.com and huggingface.co) and sends each a
# HEAD request. It prints the suite and group each chose and the algorithms
# its certificates use, and fails if any host does not handshake on TLS 1.3.
# Then it follows each pinned model's resolve URL (Qwen3-4B, 1.7B, 0.6B) by
# HEAD and prints each hop's host: the storage hosts
# modelchan::fetch::HUGGING_FACE pins.
# It runs here, on a GitHub runner, never on a developer's PC; read-only. It
# runs on pull requests that change kainet's handshake, and by hand (Actions
# tab, "TLS hosts", Run workflow). Then the host bench, for comparison.
name: TLS hosts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/tls-hosts.yml
      - kainet/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hosts:
    name: TLS 1.3 to the real hosts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Handshake with the hosts
        run: |
          set -o pipefail
          cargo run -p kainet --release --example hosts | tee tls-hosts.txt
          {
            echo "Runner: $RUNNER_NAME, run $GITHUB_RUN_ID, commit $GITHUB_SHA."
            echo
            echo '```'
            cat tls-hosts.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The bench on the runner
        run: |
          set -o pipefail
          cargo run -p kainet --release --example tlsbench | tee -a tls-hosts.txt
          {
            echo '```'
            grep tlsbench tls-hosts.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tls-hosts
          path: tls-hosts.txt
