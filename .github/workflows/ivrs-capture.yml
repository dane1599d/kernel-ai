# Spike for P6 row G61 (not for merge): QEMU's own IVRS tables, captured as
# fixtures for acpitables' IVRS parser. Ubuntu's OVMF shell has no acpiview,
# so each variant boots the runner's own Linux kernel under q35 with
# -device amd-iommu and a busybox initramfs that prints
# /sys/firmware/acpi/tables/IVRS to the serial port as base64. Runs on pushes
# to spike/ivrs-capture only.
name: ivrs capture

on:
  push:
    branches: [spike/ivrs-capture]

permissions:
  contents: read

concurrency:
  group: ivrs-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qemu
      - name: busybox and the runner's kernel
        run: |
          sudo apt-get install -y --no-install-recommends busybox-static cpio
          sudo cp /boot/vmlinuz-$(uname -r) vmlinuz
          sudo chmod 644 vmlinuz
          mkdir -p root/bin
          cp /bin/busybox root/bin/busybox
          cat > root/init <<'INIT'
          #!/bin/busybox sh
          /bin/busybox mkdir -p /sys
          /bin/busybox mount -t sysfs sysfs /sys
          /bin/busybox ls -l /sys/firmware/acpi/tables
          echo IVRS-BEGIN
          /bin/busybox base64 /sys/firmware/acpi/tables/IVRS
          echo IVRS-END
          /bin/busybox poweroff -f
          INIT
          chmod 755 root/init
          (cd root && find . | cpio -o -H newc) > initrd.cpio
      - name: Capture each variant
        shell: bash
        run: |
          set -u
          mkdir -p out
          capture() {
            name=$1; shift
            timeout 900 qemu-system-x86_64 -display none -no-reboot -m 512 \
              -kernel vmlinuz -initrd initrd.cpio \
              -append "console=ttyS0 rdinit=/init amd_iommu=off iommu=off panic=-1 quiet" \
              -serial file:"out/$name.log" -net none "$@" || echo "qemu exit $? for $name"
            tr -d '\r' < "out/$name.log" | sed -n '/^IVRS-BEGIN$/,/^IVRS-END$/p' \
              | sed '1d;$d' | base64 -d > "out/$name.bin" || echo "no table for $name"
            echo "== $name"; ls -l "out/$name.bin"; xxd "out/$name.bin"
            tail -40 "out/$name.log"
          }
          capture q35 -machine q35 -device amd-iommu
          capture q35-intremap -machine q35,kernel-irqchip=split -device amd-iommu,intremap=on
          capture q35-devices -machine q35 -device amd-iommu \
            -device pcie-root-port,id=rp1,bus=pcie.0,chassis=1 \
            -device virtio-net-pci,bus=rp1,netdev=n0 -netdev user,id=n0 \
            -device qemu-xhci -device pci-bridge,id=br1,bus=pcie.0,chassis_nr=2 \
            -device virtio-rng-pci,bus=br1
          capture q35-xtsup -machine q35,kernel-irqchip=split -device amd-iommu,intremap=on,xtsup=on
      - uses: actions/upload-artifact@v4
        with:
          name: ivrs
          path: out
          retention-days: 30
