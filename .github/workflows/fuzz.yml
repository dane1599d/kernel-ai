# libFuzzer on kainet's parsers of server bytes (plan p5-networking §1's host
# gates and §6): the TLS client's record layer and handshake, records after a
# handshake, HTTP responses with their bodies, kai-chunks 1 lists, URLs, and
# the fetch service's request lines and answers (kainet::wire); and P3's
# parsers of an app's bytes (plan p3-desktop §1 and §6's fuzz gate): surfabi's
# message stream, header page and tree records, and look's `kai-theme 1`; and
# `desktop`'s readers of other processes' bytes (plan p3-desktop section 9):
# deskcore's client calls, queues, wire parsers and agent requests; and what
# `pkg` and `updated` read from a repository and `fs`'s wire (ADR 0000 P8):
# kaipkg's `.kpkg` reader, kaituf's TUF metadata and fsproto's requests and
# replies, whose bodies are fuzz/pkg_harness.rs and fuzz/fsproto_harness.rs;
# kaimedia's PNG, JPEG, GIF and WebP decoders (P6 groundwork G8); and the
# shell's records on disk, `kai-grants 1` and `actlog`, and an agent package's
# manifest, whose bodies are fuzz/grants_harness.rs, fuzz/actlog_harness.rs and
# fuzz/agent_harness.rs, seeded with their samples; and the firmware tables
# (`acpi_tables`: the MADT, HPET, MCFG and FADT readers over a memory window;
# `ivrs_tables`: IVRS), whose bodies are acpitables/tests/hostile/harness.rs
# and ivrs.rs, seeded with the sample machine and QEMU's own IVRS tables.
# The targets are fuzz/fuzz_targets/*.rs, outside the workspace; their bodies
# are fuzz/harness.rs, fuzz/surfabi_harness.rs, fuzz/look_harness.rs and
# fuzz/media_harness.rs, which
# the crates' host tests also run, and the P3 targets' corpora are seeded with
# their hostile tests' samples. Weekly, every target for 300 s, and on demand
# (Actions tab, "Fuzz", Run workflow), on a GitHub runner, never on a
# developer's PC. A crash's input is kept as an artifact.
name: Fuzz

on:
  # Mondays 03:17 UTC: every target, at the defaults below.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      # One dispatch takes any list, so a new set of targets is one run, not one
      # dispatch per target (four queued at once on 2026-11-18).
      targets:
        description: "Targets (fuzz/fuzz_targets/*.rs), comma- or space-separated, or all"
        type: string
        default: all
      # On demand a smoke run; the weekly run keeps 300 s.
      seconds:
        description: Seconds for each target
        type: number
        default: 60

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The targets to run: every file in fuzz/fuzz_targets for `all`, so a new one
  # joins the weekly run, else the list given.
  plan:
    name: Targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: list
        env:
          # A scheduled run has no inputs: every target.
          TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          set -eu
          targets=$(echo "$TARGETS" | tr ',' ' ')
          if [ "$(echo $targets)" = all ]; then
            targets=$(ls fuzz/fuzz_targets/*.rs | xargs -n1 basename | sed 's/\.rs$//' | xargs)
          fi
          # Each target is a file and a [[bin]] of fuzz/Cargo.toml with that
          # file as its path, so a file with no [[bin]] fails here, not in its
          # own job (#1517's review). scripts/fuzz/bins.awk reads the tables,
          # with or without spaces around `=` (#1585's review), and
          # scripts/fuzz/test.sh checks it in CI.
          bins=$(awk -f scripts/fuzz/bins.awk fuzz/Cargo.toml)
          for t in $targets; do
            [ -f "fuzz/fuzz_targets/$t.rs" ] || { echo "::error::no fuzz target $t (fuzz/fuzz_targets/$t.rs)"; exit 1; }
            echo "$bins" | grep -qxF "$t fuzz_targets/$t.rs" \
              || { echo "::error::fuzz target $t has no [[bin]] in fuzz/Cargo.toml with path fuzz_targets/$t.rs"; exit 1; }
          done
          [ -n "$targets" ] || { echo "::error::no fuzz targets"; exit 1; }
          matrix=$(printf '%s\n' $targets | sort -u | jq -R . | jq -sc '{target: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  fuzz:
    name: libFuzzer ${{ matrix.target }} (${{ inputs.seconds || 300 }} s)
    needs: plan
    runs-on: ubuntu-24.04
    # The build of a target and the corpora's tests come before its own
    # seconds, so the budget is the build's, not the run's.
    timeout-minutes: 60
    strategy:
      # One target's crash must not cancel the others' runs.
      fail-fast: false
      # At most 8 builds at once, so the weekly run does not take every runner
      # the repository may use; the rest queue (#1517's review).
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # The P3, P8 and kaimedia targets start from their tests' samples: each
      # job builds and runs only the test that writes its own target's corpus
      # (#1517's review). A target that gains a `write_fuzz_seeds` joins here.
      - name: Seed the corpus
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_SEED_DIR: ${{ github.workspace }}/fuzz/corpus
        run: |
          set -eu
          case "$TARGET" in
            surfabi_stream | header_page | tree_records) seed="-p surfabi --test hostile" ;;
            kai_theme) seed="-p look --test hostile" ;;
            desk_server | desk_queues | desk_parsers | desk_agent) seed="-p deskcore --test hostile" ;;
            media_decode) seed="-p kaimedia --test hostile" ;;
            kpkg | tuf_metadata) seed="-p kaipkg --test fuzz_harness" ;;
            fsproto_request | fsproto_reply) seed="-p fsproto --test fuzz_harness" ;;
            kai_grants) seed="-p kaigrants --test hostile" ;;
            agent_manifest) seed="-p kaiagent --test hostile" ;;
            actlog) seed="-p shellcore --test actlog_hostile" ;;
            acpi_tables | ivrs_tables) seed="-p acpitables --test hostile" ;;
            *) echo "$TARGET has no seeding test: it starts from an empty corpus"; exit 0 ;;
          esac
          # shellcheck disable=SC2086 # $seed is the words of cargo's arguments.
          cargo test $seed write_fuzz_seeds -- --ignored --exact
          [ -n "$(ls -A "$FUZZ_SEED_DIR/$TARGET" 2>/dev/null)" ] \
            || { echo "::error::the seeding test wrote no corpus for $TARGET"; exit 1; }
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ inputs.seconds || 300 }}
        # The summary is written whatever the run's result, so a crash's
        # summary shows its report too (#1517's review); the step then fails
        # with the run's own status.
        run: |
          set +e
          cargo fuzz run --fuzz-dir fuzz "$TARGET" -- -max_total_time="$SECONDS_EACH" -rss_limit_mb=2048 \
            2>&1 | tee fuzz.log
          status=${PIPESTATUS[0]}
          {
            echo "### $TARGET"
            echo "Runner: $RUNNER_NAME, run $GITHUB_RUN_ID, commit $GITHUB_SHA. Exit status $status."
            echo '```'
            tail -n 20 fuzz.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts
