name: tune A/B (M10 exit test)

# The M10 exit test under icount: `cargo xtask tune ab` boots mix A twice on each
# of seeds 1-5, once on the default and once on the recorded decision (the
# founder's rule of 2026-10-21), repeats seed 1's two boots as the canary, and
# applies the rule in xtask/src/tune/ab.rs. With
# xtask/tune/decisions.json present (the real Qwen3-4B recording, from
# tune-model.yml mode record) it first checks the recording's provenance with an
# observe boot. Until then it runs the designers' hand-written spec, which
# exercises the harness but does not declare M10 done. Mix B is reported only.
#
# It runs on the `tune` label, weekly, on release/** branches, on v* tags and by
# hand, not on every push to main: the recording is keyed by the exact summary
# the guest builds, so any change to a number in it fails the run until a fresh
# real-model recording is made, and that is a re-record, not a regression. The
# tag hold is unchanged (docs/decisions/rows/2026-11-10-hold-the-tag-for-m10.md):
# the v0.1 tag waits for the proof on a fresh recording, and record on the release
# commit, then run this there.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: ["release/**"]
    tags: ["v*"]

permissions:
  contents: read

# A newer push to the same pull request cancels its older run, which only
# queues behind the batch (2026-11-14); a push, a tag or a schedule is never
# cancelled, and a label event other than full-ci gets a group of its own.
concurrency:
  group: tune-ab-${{ github.event.pull_request.number || github.sha }}${{ github.event.action == 'labeled' && !startsWith(github.event.label.name, 'full-ci') && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ab:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'tune')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Mix A, five seeds and a canary
        run: |
          if [ -f xtask/tune/decisions.json ]; then
            set +e
            cargo xtask tune ab --timeout 900 2>&1 | tee "$RUNNER_TEMP/ab-a.log"
            status=${PIPESTATUS[0]}
            # A recording the guest's summary has moved past is told apart from
            # a failed measurement; the job still fails, as M10 is not shown.
            if [ "$status" -ne 0 ] && grep -q "re-record needed" "$RUNNER_TEMP/ab-a.log"; then
              echo "::error title=re-record needed::the recording no longer matches the guest's summary; this is not a regression. Run tune-model.yml in record mode."
              echo "### re-record needed: the recorded summary is stale, nothing was measured" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$status"
          else
            cargo xtask tune ab --spec classes/firm:build-1,build-2,build-3,build-4 --timeout 900
          fi
      - name: Mix B, the control (reported, not gating)
        run: cargo xtask tune ab --mix B --spec interactive --timeout 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tune-ab-report
          path: target/tune-ab/
          if-no-files-found: warn
