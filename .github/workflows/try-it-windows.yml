# The README's "Try it" on Windows, run in CI (P6 G63): "The tooling is
# developed on Windows", but no other job boots anything there. On a hosted
# windows-2025 runner this follows the QEMU path step by step: `cargo xtask
# doctor`, then the build, then `cargo xtask run` booting the image with no
# model disk, and it passes when the serial log shows the first screen up:
# the desktop's first frame, "desktop: drew the desk at WxH"
# (user/src/bin/desktop/frame.rs). A plain `run` opens no app window, so the
# Terminal's "the terminal window has the keys" never comes here; only a
# test case such as desk-term starts one.
#
# Two differences from a person's PC, both said in the log:
# - No `cargo xtask setup`: the job attaches no model, as "With no model
#   attached, everything except the AI works" in the README.
# - TCG, not WHPX or WSL2's KVM: hosted runners have neither, so the boot is
#   `--accel tcg` and slow. `--headless` keeps QEMU's window shut, as a
#   runner has no one to look at it.
#
# Time: the job gets 60 minutes, the boot up to 30 of them. Doctor takes
# about 7 minutes and the build 12.5; the TCG boot has the desk up within 5
# (run 46127731872 was idling at the desktop by then, and only waited for the
# Terminal's line, which a plain boot never prints). The boot step prints a
# progress line every 5 minutes (minutes, serial lines, the latest one), and
# when it fails or runs out of time the next step prints the last 100 serial
# lines, so the job log shows where the boot got to without fetching the
# artifact. The VM keeps `run`'s default vCPUs, as a person's boot does.
#
# QEMU for Windows is Stefan Weil's build (the one qemu.org's download page
# links for Windows), installed to C:\Program Files\qemu, where xtask looks
# (`find_qemu`), with its own edk2 firmware. The installer is pinned by its
# SHA-512. The checkout is byte for byte the committed tree, LF and all
# (`* -text` in .gitattributes), as a person's clone is. Read access only; no
# secret. Started weekly, by hand, or by a pull request that changes this file
# or .gitattributes.
name: Try it on Windows, weekly

on:
  schedule:
    - cron: "29 5 * * 1"
  pull_request:
    paths:
      - .github/workflows/try-it-windows.yml
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QEMU_SETUP: qemu-w64-setup-20260811.exe
  QEMU_SETUP_SHA512: 5bcf9eed634e8575a37b74f445af41a2fe4106da512d0c30c368301d4c105037fdfab40a5287367a28a957624cddebbc8c07e16c88ab6634f554cdf3d16bf543
  # The desktop's first frame (user/src/bin/desktop/frame.rs), once per boot.
  FIRST_SCREEN: "desktop: drew the desk at"

defaults:
  run:
    shell: bash

concurrency:
  group: try-it-windows-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  try-it:
    name: Try it (windows-2025, QEMU under TCG, no model)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: QEMU for Windows, pinned by SHA-512
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$QEMU_SETUP" "https://qemu.weilnetz.de/w64/2026/$QEMU_SETUP"
          echo "$QEMU_SETUP_SHA512  $RUNNER_TEMP/$QEMU_SETUP" | sha512sum -c -
      - name: Install it to C:\Program Files\qemu (silent NSIS install)
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\$env:QEMU_SETUP" -ArgumentList '/S'
          & 'C:\Program Files\qemu\qemu-system-x86_64.exe' --version
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - name: "Try it, step 1: check your PC"
        run: cargo xtask doctor
      - name: "Step 2, cargo xtask setup, is left out: this run attaches no model"
        run: |
          echo "no model: the README's 'With no model attached, everything except the AI works'"
      - name: Build
        run: cargo xtask build
      - name: Boot under TCG with no model disk, until the first screen is up
        id: boot
        timeout-minutes: 35
        run: |
          echo "WHPX is not on hosted runners (nor KVM in WSL2): booting with --accel tcg"
          log="$RUNNER_TEMP/run.log"
          cargo xtask run --accel tcg --headless > "$log" 2>&1 &
          pid=$!
          found=
          # 30 minutes in steps of 10 s: TCG on a hosted runner boots slowly.
          # Every 30th step (5 minutes) says how far the serial log has got.
          for i in $(seq 1 180); do
            if grep -qF "$FIRST_SCREEN" "$log"; then found=1; break; fi
            kill -0 "$pid" 2>/dev/null || { echo "xtask run exited before the first screen"; break; }
            if [ $((i % 30)) -eq 0 ]; then
              echo "$((i / 6)) min: $(wc -l < "$log") serial lines; latest: $(tail -n 1 "$log" | cut -c1-200)"
            fi
            sleep 10
          done
          taskkill //F //IM qemu-system-x86_64.exe > /dev/null 2>&1 || true
          wait "$pid" 2>/dev/null || true
          if [ -z "$found" ]; then
            echo "the first screen's line never came: $FIRST_SCREEN"
            exit 1
          fi
          echo "the first screen is up after about $((i / 6)) min: $(grep -F "$FIRST_SCREEN" "$log" | head -1)"
      - name: The last 100 serial lines, when the boot failed or ran out of time
        if: always() && steps.boot.outcome != 'success' && steps.boot.outcome != 'skipped'
        run: |
          taskkill //F //IM qemu-system-x86_64.exe > /dev/null 2>&1 || true
          tail -n 100 "$RUNNER_TEMP/run.log" || echo "no serial log at $RUNNER_TEMP/run.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: try-it-windows-log
          path: ${{ runner.temp }}/run.log
          if-no-files-found: ignore
