# Spikes S02-1 (the action gate, ADR 0002) and S10-1 (pack format and scale,
# ADR 0010) on the real model, on GitHub's machine instead of a PC: it downloads
# the pinned qwen3-4b-2507 file named in xtask/models.json, checks its SHA-256,
# runs `cargo xtask actbench --local qwen3-4b-2507` through Kernel AI's own
# engine for the arms and seeds asked for, and uploads each run's jsonl (headed
# by its pack_id). One job at a time, started by hand only: Actions tab, "Action
# accuracy on the real model", Run workflow; or, before this file is on main, by
# adding the label `actbench` to a pull request (the default arms and seed 42).
# The run reports; task 18 turns it into a gate that fails the job.
name: Action accuracy on the real model

on:
  workflow_dispatch:
    inputs:
      arms:
        description: "Arms, comma-separated: dsl-1, hermes-1, prose-1 (add :no-think, @80), m8, m8-a0"
        default: "dsl-1,hermes-1,m8,m8-a0"
      seeds:
        description: "Seeds, comma-separated"
        default: "42"
      limit:
        description: "Only the first N tasks of each category (empty for all)"
        default: ""
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: real-model-actbench
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MODEL_ID: qwen3-4b-2507

jobs:
  actbench:
    name: actbench (qwen3-4b-2507, local engine)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'actbench'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Show the runner's CPU count, vector features and memory
        run: |
          nproc
          grep -m1 '^flags' /proc/cpuinfo | grep -o -w -E 'avx2|avx512f|avx512bw|avx512_vnni' | xargs echo
          free -g
      - name: Read the pinned file from the catalog
        id: pin
        run: |
          jq -e --arg id "$MODEL_ID" '.models[] | select(.id == $id)' xtask/models.json > "$RUNNER_TEMP/entry.json"
          {
            echo "file=$(jq -r .file "$RUNNER_TEMP/entry.json")"
            echo "sha256=$(jq -r .sha256 "$RUNNER_TEMP/entry.json")"
            echo "url=https://huggingface.co/$(jq -r .repo "$RUNNER_TEMP/entry.json")/resolve/$(jq -r .revision "$RUNNER_TEMP/entry.json")/$(jq -r .file "$RUNNER_TEMP/entry.json")"
          } >> "$GITHUB_OUTPUT"
      - name: Reuse the model file from an earlier run
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kai-models
          key: model-${{ steps.pin.outputs.sha256 }}
      - name: Download the model and check its SHA-256
        env:
          KAI_MODELS: ${{ runner.temp }}/kai-models
          FILE: ${{ steps.pin.outputs.file }}
          SHA256: ${{ steps.pin.outputs.sha256 }}
          URL: ${{ steps.pin.outputs.url }}
        run: |
          mkdir -p "$KAI_MODELS"
          if [ ! -f "$KAI_MODELS/$FILE" ]; then
            curl -fL --retry 3 -o "$KAI_MODELS/$FILE" "$URL"
          fi
          echo "$SHA256  $KAI_MODELS/$FILE" | sha256sum -c -
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run the arms on the local engine
        env:
          KAI_MODELS: ${{ runner.temp }}/kai-models
          ARMS: ${{ inputs.arms || 'dsl-1,hermes-1,m8,m8-a0' }}
          SEEDS: ${{ inputs.seeds || '42' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -- --local "$MODEL_ID" --arm "$ARMS" --seed "$SEEDS"
          if [ -n "$LIMIT" ]; then set -- "$@" --limit "$LIMIT"; fi
          cargo xtask actbench "$@"
      - name: Upload the runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actbench-${{ env.MODEL_ID }}-${{ github.run_id }}
          path: target/actbench/*.jsonl
          if-no-files-found: warn
