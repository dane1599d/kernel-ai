# The actbench gate (P1 task 18; spikes S02-1 and S10-1, ADR 0002 and ADR 0010)
# on the real model, on GitHub's machine instead of a PC. It downloads the
# pinned qwen3-4b-2507 file named in xtask/models.json, checks its SHA-256 and
# runs `cargo xtask actbench --local qwen3-4b-2507` through Kernel AI's own
# engine.
#
# The gate (the label `actbench` on a pull request, or Run workflow with
# arms "act" and gate on): arm `act`, what ships, at seeds 42, 1 and 2, one job
# each in parallel. Its 190 tasks decode with `infer::tagged` on the dsl-1 pack
# and are judged by `agentabi::consent`; its M8 50 go through the shell's one
# door with llm's own `act` path on the OS pack. A job fails when its seed
# misses a bar of the P1 plan's section 6; each writes its bars, pack_id and
# OS pack_id to the job summary and uploads its jsonl. About 45 minutes a seed.
#
# Run workflow with other arms is for measurements (dsl-1, hermes-1, prose-1, os,
# :no-think, @80, +rules, +m8script, +index, m8, m8-a0), one job, gate off by default.
# Started by hand only, one run at a time; never on every PR.
name: actbench gate on the real model

on:
  workflow_dispatch:
    inputs:
      arms:
        description: "Arms, comma-separated: act (what ships), dsl-1, hermes-1, prose-1 (add :no-think, @80, +rules, +m8script), m8, m8-a0"
        default: "act"
      seeds:
        description: "Seeds, comma-separated"
        default: "42,1,2"
      limit:
        description: "Only the first N tasks of each category (empty for all)"
        default: ""
      gate:
        description: "Fail the job when a bar is missed"
        type: boolean
        default: true
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  # Any other label on a pull request starts a run with no job; it gets a group
  # of its own, so it never waits behind a gate, nor cancels a dispatched run
  # waiting for one (GitHub keeps one pending run a group).
  group: real-model-actbench-${{ github.event_name == 'pull_request' && github.event.label.name != 'actbench' && github.run_id || 'gate' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MODEL_ID: qwen3-4b-2507

jobs:
  actbench:
    name: actbench ${{ matrix.arms }} seeds ${{ matrix.seeds }}
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'actbench'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{{"arms":"{0}","seeds":"{1}","extra":"{2}"}}]', inputs.arms, inputs.seeds, inputs.gate && '--gate' || '') || '[{"arms":"act","seeds":"42","extra":"--gate"},{"arms":"act","seeds":"1","extra":"--gate"},{"arms":"act","seeds":"2","extra":"--gate"}]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Show the runner's CPU count, vector features and memory
        run: |
          nproc
          grep -m1 '^flags' /proc/cpuinfo | grep -o -w -E 'avx2|avx512f|avx512bw|avx512_vnni' | xargs echo
          free -g
      - name: Read the pinned file from the catalog
        id: pin
        run: |
          jq -e --arg id "$MODEL_ID" '.models[] | select(.id == $id)' xtask/models.json > "$RUNNER_TEMP/entry.json"
          {
            echo "file=$(jq -r .file "$RUNNER_TEMP/entry.json")"
            echo "sha256=$(jq -r .sha256 "$RUNNER_TEMP/entry.json")"
            echo "url=https://huggingface.co/$(jq -r .repo "$RUNNER_TEMP/entry.json")/resolve/$(jq -r .revision "$RUNNER_TEMP/entry.json")/$(jq -r .file "$RUNNER_TEMP/entry.json")"
          } >> "$GITHUB_OUTPUT"
      - name: Reuse the model file from an earlier run
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kai-models
          key: model-${{ steps.pin.outputs.sha256 }}
      - name: Download the model and check its SHA-256
        env:
          KAI_MODELS: ${{ runner.temp }}/kai-models
          FILE: ${{ steps.pin.outputs.file }}
          SHA256: ${{ steps.pin.outputs.sha256 }}
          URL: ${{ steps.pin.outputs.url }}
        run: |
          mkdir -p "$KAI_MODELS"
          if [ ! -f "$KAI_MODELS/$FILE" ]; then
            curl -fL --retry 3 -o "$KAI_MODELS/$FILE" "$URL"
          fi
          echo "$SHA256  $KAI_MODELS/$FILE" | sha256sum -c -
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run the arms on the local engine
        env:
          KAI_MODELS: ${{ runner.temp }}/kai-models
          ARMS: ${{ matrix.arms }}
          SEEDS: ${{ matrix.seeds }}
          EXTRA: ${{ matrix.extra }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -- --local "$MODEL_ID" --arm "$ARMS" --seed "$SEEDS"
          if [ -n "$LIMIT" ]; then set -- "$@" --limit "$LIMIT"; fi
          if [ -n "$EXTRA" ]; then set -- "$@" $EXTRA; fi
          cargo xtask actbench "$@"
      - name: Upload the runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actbench-${{ env.MODEL_ID }}-${{ github.run_id }}-${{ strategy.job-index }}
          path: target/actbench/*.jsonl
          if-no-files-found: warn
