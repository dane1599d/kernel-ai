# The release pipeline (ADR 0008 section 8, ADR 0009 D7, P4 task 17).
#
# On a `v*` tag: build the release image twice on clean runners and require one
# SHA-256, rebuild it from the source tarball with no network and require the
# same, assemble the five assets, sign them as TUF targets of a throwaway test
# repository and check a client accepts them and refuses a tampered copy, then,
# in the protected `release` environment, attest the assets and draft the GitHub
# Release. The founder publishes the draft by hand.
#
# `release-dry` is this workflow on a pull request that changes it, or on
# demand: everything but the attestation and the draft, as `v0.1.0-rc.0`.
#
# The `vm` job boots the slot disk in QEMU under KVM: `updated` takes release 2
# from an update disk signed by a throwaway root and boots it, and refuses the
# same disk with one byte of the image flipped (boot cases `update-disk` and
# `update-tampered`, ADR 0008 §12).
#
# Once `release/pkgrepo/` is committed (P4 task 18's interim key files,
# `cargo xtask release-repo`), the image carries it as `pkgrepo/`, its `models`
# role signed with the founder's release key, and its root as `kai.root.json`.
# `assemble` checks that the image holds that root in both places, and on a tag
# `seq` checks every root file is each earlier release's byte for byte: they are
# frozen. `publish` requires root to name the key the founder pinned as
# `RELEASE_ROOT_KEY` in the `release` environment, and every other role
# `RELEASE_KEY`: anchors outside the repository. It also writes both keys into
# the draft's notes, which the founder holds against the paper before publishing.
# `sign-script-macos` runs the sign script as the founder runs it, on a Mac,
# on both rounds of a folder xtask prepares (`sign-fixture`),
# with test keys.
#
# The `release-boot` job boots build-a's image itself, with qwen3-0.6b attached
# as the import disk, types `models import` and passes on the import line
# (`cargo xtask release-boot`): the role that ships is the one that imports.
# With no repository committed, it builds the same image with `--test-root`
# instead, whose `pkgrepo/` a throwaway root signs, checks that every other boot
# module and part hashes as build-a's did, and boots that.
#
# The `sign` job also uploads the committed `kai-chunks 1` lists in
# xtask/models/chunks as `models-chunks-<version>`, before any build runs, for
# the `models` role to sign beside each `<id>.gguf` as `<sha256>.chunks` (P5
# tasks 6 and 9). It then downloads every pinned model of xtask/models.json
# (.github/release/fetch_models.py), requires each list to be its file's own
# (`cargo xtask pkgrepo chunks`), and holds the upload to the commit's blobs.
# The models are only hashed, never run.
#
# Stubbed until the YubiKey root (root-ceremony.md): the publish to
# `dane1599d/kernel-ai-updates`. No LLM runs.
# Every action is pinned by commit SHA.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release/**
      - xtask/src/release_image.rs
      - xtask/src/image/slots.rs
      - xtask/src/release_boot.rs
      - xtask/src/cases/release.rs
      - xtask/src/release_repo/**
      - release/keys/**
      - release/pkgrepo/**
      - scripts/release-sign.sh
      - .github/actions/qemu/build.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The version: the tag, or the dry run's throwaway one.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0-rc.0' }}
  # Where the release build reads its crates, and the offline rebuild mounts the
  # vendored ones, so panic locations and line tables match (decisions.md, S09-1).
  REGISTRY_SRC: /home/runner/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f
  # ci.yml's QEMU, for the `vm` and `release-boot` jobs: bump with ci.yml's.
  QEMU_VERSION: "11.0.5"
  QEMU_SHA256: 38a1a09f349660cb0e20b8fe5f224d6a53ec4235eb36f2e33a31e21bb6138147

# bash -eo pipefail: a step piped through tee fails when its command does.
defaults:
  run:
    shell: bash

# A newer push to the same pull request cancels its older run, which only
# queues behind the batch (2026-11-14); a push, a tag or a schedule is never
# cancelled, and a label event other than full-ci gets a group of its own.
concurrency:
  group: release-${{ github.event.pull_request.number || github.sha }}${{ github.event.action == 'labeled' && !startsWith(github.event.label.name, 'full-ci') && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ADR 0008 §2: `release_seq` only rises. A tag's `release/seq` must be above the
  # highest published one. Until `kernel-ai-updates` publishes TUF metadata (P4
  # task 18), that is the previous `v*` tag's `release/seq`. Only a tag is a
  # release: a dry run (a pull request, or on demand) is not, and once a tag
  # exists its unbumped seq would fail every dry run (#754, after v0.1.0-rc.1).
  seq:
    name: release/seq is above the last release's
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: |
          seq=$(cat release/seq)
          case "$seq" in ''|*[!0-9]*) echo "release/seq holds '$seq', not a number"; exit 1;; esac
          previous=$(git tag --list 'v*' --sort=-creatordate | grep -vx "$VERSION" | head -1 || true)
          last=0
          if [ -n "$previous" ]; then
            last=$(git show "$previous:release/seq" 2>/dev/null || echo 0)
          fi
          echo "release/seq $seq; the last release ($previous) had $last"
          if [ "$seq" -le "$last" ]; then
            echo "release/seq must rise above $last: bump it in the release PR"
            exit 1
          fi
          # The founder-signed root never changes once released (root-ceremony.md):
          # every earlier release that carries one must carry these bytes.
          for tag in $(git tag --list 'v*'); do
            [ "$tag" = "$VERSION" ] && continue
            for root in $(git ls-tree --name-only "$tag" release/pkgrepo/metadata/ | grep '\.root\.json$' || true); do
              if ! git diff --quiet "$tag" HEAD -- "$root"; then
                echo "$root differs from $tag's: root files are frozen"
                exit 1
              fi
            done
          done

  build:
    name: Build the release image (runner ${{ matrix.runner }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        runner: [a, b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Outputs go outside the checkout: an untracked file would mark the build
      # -dirty and change the image.
      - run: mkdir -p "$RUNNER_TEMP/out" && echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo xtask release-image --out "$OUT/kernel-ai.img" | tee "$OUT/build.log"
      # The image is gigabytes, most of them kai-data's free space: it travels
      # compressed, and the same zstd on the same bytes writes the same file.
      - run: zstd -19 --single-thread -q --rm "$OUT/kernel-ai.img" -o "$OUT/kernel-ai.img.zst"
      - name: The build left the tree clean
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.runner }}
          path: |
            ${{ env.OUT }}/kernel-ai.img.zst
            ${{ env.OUT }}/NOTICES.txt
            ${{ env.OUT }}/build.log

  source:
    name: Source tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - name: Sources, every crate vendored (build-std's too), Limine, and the commit
        run: |
          out="$RUNNER_TEMP/out" && mkdir -p "$out"
          cargo xtask limine
          git rev-parse --short=12 HEAD > COMMIT
          sysroot=$(rustc --print sysroot)
          mkdir -p .cargo-offline
          cargo vendor --locked --versioned-dirs \
            --sync "$sysroot/lib/rustlib/src/rust/library/Cargo.toml" vendor > .cargo-offline/config.toml
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --exclude=./target --exclude=./.git -cf - . target/limine-*/ \
            | zstd -19 --single-thread -q -o "$out/kernel-ai-$VERSION-source.tar.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source
          path: ${{ runner.temp }}/out/kernel-ai-${{ env.VERSION }}-source.tar.zst

  offline:
    name: Rebuild from the source tarball, offline
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source
      - name: Unpack, and install the pinned toolchain for the container to borrow
        run: |
          mkdir src && zstd -dc "kernel-ai-$VERSION-source.tar.zst" | tar -xf - -C src
          cd src && (rustup show active-toolchain || rustup toolchain install)
          rustup target add wasm32-unknown-unknown
      - name: Build with --network none, crates at the release build's registry path
        run: |
          ws=/home/runner/work/kernel-ai/kernel-ai
          mkdir -p home/.cargo && cp -r ~/.cargo/bin home/.cargo/bin
          sed "s|directory = \"vendor\"|directory = \"$REGISTRY_SRC\"|" src/.cargo-offline/config.toml > home/.cargo/config.toml
          docker pull -q buildpack-deps:noble
          docker run --rm --network none -u "$(id -u):$(id -g)" \
            -e HOME=/home/runner -e CARGO_HOME=/home/runner/.cargo -e RUSTUP_HOME=/home/runner/.rustup \
            -e PATH=/home/runner/.cargo/bin:/usr/bin:/bin -e CARGO_NET_OFFLINE=true \
            -v "$PWD/home/.cargo:/home/runner/.cargo" -v "$HOME/.rustup:/home/runner/.rustup" \
            -v "$PWD/src:$ws" -v "$PWD/src/vendor:$REGISTRY_SRC:ro" -w "$ws" buildpack-deps:noble \
            cargo xtask release-image --out offline.img | tee offline.log
          zstd -19 --single-thread -q --rm src/offline.img -o src/offline.img.zst
          mkdir out && mv src/offline.img.zst src/NOTICES.txt offline.log out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline
          path: out/

  assemble:
    name: One SHA-256, then the five assets
    needs: [build, offline]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      - name: Both clean builds and the offline rebuild made the same image
        run: |
          sha256sum build-a/kernel-ai.img.zst build-b/kernel-ai.img.zst offline/offline.img.zst | tee hashes.txt
          test "$(cut -d' ' -f1 hashes.txt | sort -u | wc -l)" -eq 1
          # The image's own hash, as each build printed it.
          grep -h '^xtask: sha256 ' build-a/build.log build-b/build.log offline/offline.log | tee image-hashes.txt
          test "$(wc -l < image-hashes.txt)" -eq 3
          test "$(sort -u image-hashes.txt | wc -l)" -eq 1
          cmp build-a/NOTICES.txt build-b/NOTICES.txt
          cmp build-a/NOTICES.txt offline/NOTICES.txt
      - name: The image carries the committed root as kai.root.json and as pkgrepo's root
        run: |
          root=release/pkgrepo/metadata/1.root.json
          if [ -f "$root" ]; then
            sha=$(sha256sum "$root" | cut -d' ' -f1)
            grep -E "^xtask: module kai.root.json [0-9]+ $sha$" build-a/build.log
            grep -E "^xtask: module pkgrepo/metadata/1.root.json [0-9]+ $sha$" build-a/build.log
          elif grep -E '^xtask: module (kai.root.json|pkgrepo/)' build-a/build.log; then
            echo "no release/pkgrepo is committed, yet the image carries a root or a repository"
            exit 1
          fi
      - name: The assets
        run: |
          mkdir release-assets
          cp build-a/kernel-ai.img.zst "release-assets/kernel-ai-$VERSION-x86_64.img.zst"
          cp build-a/NOTICES.txt release-assets/NOTICES.txt
          cp "source/kernel-ai-$VERSION-source.tar.zst" release-assets/
          python3 - "$VERSION" > release-assets/RELEASE-NOTES.md <<'EOF'
          import json, sys
          catalog = json.load(open("xtask/models.json"))
          model = next(m for m in catalog["models"] if m["id"] == catalog["default"])
          print(f"# Kernel AI {sys.argv[1]}\n")
          print("The image holds no AI model. Attach this one as a disk; Models imports and checks it:\n")
          print(f"- `{model['repo']}`, file `{model['file']}`, revision `{model['revision']}`")
          print(f"- SHA-256 `{model['sha256']}`, {model['size']} bytes, licence {model['license']}")
          print("- Base model: Qwen/Qwen3-4B-Instruct-2507")
          EOF
          (cd release-assets && sha256sum -- * > SHA256SUMS)
          cat release-assets/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ env.VERSION }}
          path: release-assets/

  vm:
    name: A VM takes an update from an update disk and refuses a tampered one
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # QEMU as ci.yml's `qemu` job builds and caches it (.github/actions/qemu),
      # restored here with the cache action pinned by SHA. On a miss (GitHub
      # evicted it, and ci.yml may be rebuilding it now) this job builds its
      # own the same way, about ten minutes, and saves nothing.
      - id: qemu
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/qemu
          key: qemu-${{ env.QEMU_VERSION }}-ubuntu-24.04-v1
      - name: Build QEMU ${{ env.QEMU_VERSION }} (the cache missed)
        if: steps.qemu.outputs.cache-hit != 'true'
        run: bash .github/actions/qemu/build.sh
      - name: OVMF, QEMU's runtime libraries, and KVM for the runner user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ovmf libpixman-1-0 libslirp0 libglib2.0-0t64 libfdt1
          echo "$HOME/qemu/bin" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - name: update-disk, then update-tampered
        run: |
          for case in update-disk update-tampered; do
            XTASK_CASE="$case" cargo xtask test --accel kvm --timeout 300
          done

  release-boot:
    name: The release boots and imports qwen3-0.6b under its models role
    needs: build
    runs-on: ubuntu-24.04
    # 90, and up to 20 more for a QEMU build on a cache miss.
    timeout-minutes: 110
    env:
      MODEL_ID: qwen3-0.6b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # QEMU as in `vm`: restored, or built here on a miss.
      - id: qemu
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/qemu
          key: qemu-${{ env.QEMU_VERSION }}-ubuntu-24.04-v1
      - name: Build QEMU ${{ env.QEMU_VERSION }} (the cache missed)
        if: steps.qemu.outputs.cache-hit != 'true'
        run: bash .github/actions/qemu/build.sh
      - name: OVMF, QEMU's runtime libraries, and KVM for the runner user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ovmf libpixman-1-0 libslirp0 libglib2.0-0t64 libfdt1
          echo "$HOME/qemu/bin" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - name: Read the pinned file from the catalog
        id: pin
        run: |
          jq -e --arg id "$MODEL_ID" '.models[] | select(.id == $id)' xtask/models.json > "$RUNNER_TEMP/entry.json"
          {
            echo "file=$(jq -r .file "$RUNNER_TEMP/entry.json")"
            echo "sha256=$(jq -r .sha256 "$RUNNER_TEMP/entry.json")"
            echo "url=https://huggingface.co/$(jq -r .repo "$RUNNER_TEMP/entry.json")/resolve/$(jq -r .revision "$RUNNER_TEMP/entry.json")/$(jq -r .file "$RUNNER_TEMP/entry.json")"
          } >> "$GITHUB_OUTPUT"
      - name: Reuse the model file from an earlier run
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/kai-models
          key: model-${{ steps.pin.outputs.sha256 }}
      - name: Download the model and check its SHA-256
        env:
          FILE: ${{ steps.pin.outputs.file }}
          SHA256: ${{ steps.pin.outputs.sha256 }}
          URL: ${{ steps.pin.outputs.url }}
        run: |
          mkdir -p "$RUNNER_TEMP/kai-models"
          if [ ! -f "$RUNNER_TEMP/kai-models/$FILE" ]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/kai-models/$FILE" "$URL"
          fi
          echo "$SHA256  $RUNNER_TEMP/kai-models/$FILE" | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-a
          # Outside the checkout, as every output here: an untracked file marks
          # the build -dirty, which the slot record, the kernel and NOTICES carry.
          path: ${{ runner.temp }}/build-a
      - name: Boot the release itself once its signed repository is committed
        id: image
        run: |
          if [ -f release/pkgrepo/metadata/1.root.json ]; then
            zstd -dq "$RUNNER_TEMP/build-a/kernel-ai.img.zst" -o "$RUNNER_TEMP/boot.img"
            echo "boots the release image and its founder-signed models role" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "test_root=false" >> "$GITHUB_OUTPUT"
          else
            echo "test_root=true" >> "$GITHUB_OUTPUT"
          fi
      - name: With none, the test-root build, which differs from build-a's only beneath pkgrepo/
        if: steps.image.outputs.test_root == 'true'
        run: |
          test -z "$(git status --porcelain)"
          cargo xtask release-image --test-root --out "$RUNNER_TEMP/boot.img" | tee "$RUNNER_TEMP/test-root.log"
          # Every boot module but the test root's repository, and every ESP part
          # but the bundle that carries it.
          same() { grep -E '^xtask: (module|part) ' "$1" | grep -v -E '^xtask: (module pkgrepo/|part boot/kai.bundle )'; }
          same "$RUNNER_TEMP/build-a/build.log" > "$RUNNER_TEMP/release.parts"
          same "$RUNNER_TEMP/test-root.log" > "$RUNNER_TEMP/test-root.parts"
          test -s "$RUNNER_TEMP/release.parts"
          diff "$RUNNER_TEMP/release.parts" "$RUNNER_TEMP/test-root.parts"
          grep -E '^xtask: module pkgrepo/' "$RUNNER_TEMP/test-root.log"
      - name: Boot it with qwen3-0.6b as the import disk; models import, allowed
        env:
          FILE: ${{ steps.pin.outputs.file }}
        run: |
          cargo xtask release-boot --image "$RUNNER_TEMP/boot.img" \
            --model "$RUNNER_TEMP/kai-models/$FILE" --accel kvm --timeout 1200

  # Round 1's folder as `release-repo prepare` leaves it, for the test keys
  # (RFC 8032's test 1 and test 2 seeds) at this runner's clock, for the macOS
  # job to sign: xtask's own text, packages and catalog models included.
  sign-fixture:
    name: A round to sign, as xtask prepares it (test keys)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: |
          KAI_SIGN_FIXTURE="$RUNNER_TEMP/fixture" cargo test -p xtask --bin xtask \
            release_repo::tests::write_round_one_for_the_macos_job -- --ignored --exact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sign-fixture
          path: ${{ runner.temp }}/fixture/work

  # The founder signs on a Mac (root-ceremony.md): the script runs there in
  # /bin/bash 3.2 with BSD tools and Homebrew's openssl@3. Test keys only.
  sign-script-macos:
    name: release-sign.sh on macOS signs RFC 8032 test 2 (bash 3.2, openssl@3)
    needs: sign-fixture
    # Apple silicon, as the founder's Mac; macos-14 is no longer offered.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sign-fixture
          path: ${{ runner.temp }}/work
      - run: |
          brew list openssl@3 > /dev/null 2>&1 || brew install openssl@3
          o=/opt/homebrew/opt/openssl@3/bin/openssl
          "$o" version
          /bin/bash --version | head -1
          t=$(mktemp -d) && mkdir "$t/keys"
          w=$RUNNER_TEMP/work
          # RFC 8032 section 7.1's test 1 and test 2 seeds as root.key and release.key.
          for k in root:9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60 \
            release:4ccd089b28ff96da9db6c346ec114e0f5b8a319f35aba624da8cf6ed4fb8a6fb; do
            printf '302e020100300506032b657004220420%s' "${k#*:}" | xxd -r -p > "$t/seed.der"
            printf 'test pass\n' | "$o" pkcs8 -topk8 -v2 aes-256-cbc -scrypt -scrypt_N 16384 -scrypt_r 8 \
              -scrypt_p 64 -inform DER -in "$t/seed.der" -out "$t/keys/${k%%:*}.key" -passout stdin
            printf 'test pass\n' | "$o" pkey -in "$t/keys/${k%%:*}.key" -passin stdin -pubout -out "$t/keys/${k%%:*}.pub"
          done
          # The ledger, empty, as setup makes it.
          : > "$t/keys/signed.log"
          # The script's own signing command gives RFC 8032 test 2's signature of 0x72.
          printf '\x72' > "$t/message"
          sig=$(printf 'test pass\n' | "$o" pkeyutl -sign -rawin -inkey "$t/keys/release.key" -passin stdin -in "$t/message" |
            od -An -v -tx1 | tr -d ' \n')
          test "$sig" = \
            92a009a9f0d4cab8720e820b5f642540a2b27b5416503f8fb3762223ebdb69da085ac1e43e15996e458f3613d0f11d8c387b2eaeb4302aeeb00d291612bb0c00
          sign() { env -i /bin/bash --noprofile --norc scripts/release-sign.sh "$t/keys" "$w"; }
          verify() {
            xxd -r -p "$w/$1.sig" > "$t/raw"
            "$o" pkeyutl -verify -pubin -inkey "$t/keys/$2.pub" -rawin -in "$w/$1.canon" -sigfile "$t/raw"
          }
          # Round 1, as xtask prepared it: root with root.key, the rest with release.key.
          out=$(printf 'test pass\ntest pass\n' | sign)
          echo "$out"
          echo "$out" | grep -q '^round 1 of release 1: signs models packages root snapshot targets$'
          echo "$out" | grep -q '^release.key is 3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c$'
          echo "$out" | grep -q '^models.canon signs qwen3-0.6b.gguf, sha256 [0-9a-f]*, length [0-9]*, name '
          echo "$out" | grep -q '^packages.canon signs notes-1.0.0.kpkg, sha256 [0-9a-f]*, grants \[\], actions \["notes_find"\], yanked false$'
          echo "$out" | grep -q '^root.canon expires .*, in 365 days$'
          echo "$out" | grep -q '^snapshot.canon expires .*, in 30 days$'
          verify root root
          for r in targets packages models snapshot; do verify "$r" release; done
          # Round 2, as `prepare-timestamp` leaves it: the timestamp that names
          # the snapshot round 1 signed, as the device fetches it.
          at=$(date -u -r $(( $(date -u +%s) + 7 * 86400 )) +%Y-%m-%dT%H:%M:%SZ)
          lid=eaf1e23f6c823132f437a2eaa299a7950f7386631deff273db195bbd26209e2b
          signed=$(printf '{"signatures":[{"keyid":"%s","sig":"%s"}],"signed":%s}' "$lid" "$(cat "$w/snapshot.sig")" "$(cat "$w/snapshot.canon")")
          printf '{"_type":"timestamp","expires":"%s","meta":{"snapshot.json":{"hashes":{"sha256":"%s"},"length":%s,"version":1}},"spec_version":"1.0.37","version":1}' \
            "$at" "$(printf '%s' "$signed" | shasum -a 256 | cut -c1-64)" "${#signed}" > "$w/timestamp.canon"
          out=$(printf 'test pass\n' | sign)
          echo "$out"
          echo "$out" | grep -q '^round 2 of release 1: signs timestamp$'
          echo "$out" | grep -q '^timestamp.canon expires .*, in 7 days$'
          verify timestamp release
          # The stick's ledger has both rounds, and a release is signed once.
          cat "$t/keys/signed.log"
          test "$(wc -l < "$t/keys/signed.log" | tr -d ' ')" = 2
          head -1 "$t/keys/signed.log" | grep -Eq '^1 1 models=[0-9a-f]{64} packages=[0-9a-f]{64} root=[0-9a-f]{64} snapshot=[0-9a-f]{64} targets=[0-9a-f]{64}$'
          tail -1 "$t/keys/signed.log" | grep -Eq '^2 1 timestamp=[0-9a-f]{64}$'
          # The same round 2 again signs the same bytes and logs nothing new.
          mv "$w/timestamp.sig" "$t/timestamp.sig"
          printf 'test pass\n' | sign
          cmp "$w/timestamp.sig" "$t/timestamp.sig"
          test "$(wc -l < "$t/keys/signed.log" | tr -d ' ')" = 2
          # Another timestamp for release 1 is refused: a release is signed once.
          rm "$w/timestamp.sig"
          sed "s/\"expires\":\"[^\"]*\"/\"expires\":\"$(date -u -r $(( $(date -u +%s) + 6 * 86400 )) +%Y-%m-%dT%H:%M:%SZ)\"/" \
            "$w/timestamp.canon" > "$t/timestamp.canon"
          mv "$t/timestamp.canon" "$w/timestamp.canon"
          if printf 'test pass\n' | sign 2> "$t/err"; then exit 1; fi
          grep -q 'is not the last round these keys signed' "$t/err"

  sign:
    name: Sign as TUF targets (test root), accept and refuse
    needs: assemble
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ env.VERSION }}
          path: release-assets
      - name: Throwaway root; the image and SHA256SUMS as targets; a client accepts them, a flipped byte is refused
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet tuf==6.0.0 'securesystemslib[crypto]==1.3.0'
          "$RUNNER_TEMP/venv/bin/python" .github/release/tuf_test_target.py "$RUNNER_TEMP/tuf" \
            "release-assets/kernel-ai-$VERSION-x86_64.img.zst" release-assets/SHA256SUMS
      - name: The committed chunk lists, as the commit holds them, before any build runs
        run: |
          mkdir -p "$RUNNER_TEMP/models-chunks"
          cp xtask/models/chunks/*.chunks "$RUNNER_TEMP/models-chunks/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: models-chunks-${{ env.VERSION }}
          path: ${{ runner.temp }}/models-chunks
      - name: Reuse the pinned models from an earlier run
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/kai-models
          key: model-chunks-${{ hashFiles('xtask/models.json') }}
      - name: Download every pinned model and check its SHA-256 (hashed, never run)
        run: python3 -I .github/release/fetch_models.py "$RUNNER_TEMP/kai-models"
      - run: rustup show active-toolchain || rustup toolchain install
      - name: The committed chunk lists are the pinned files' own, 2 MiB chunk by chunk
        run: cargo xtask pkgrepo chunks --models "$RUNNER_TEMP/kai-models"
      - name: The uploaded lists are the commit's own blobs, one for each catalog model
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/models-chunks"
          committed=$(git ls-tree --name-only "$GITHUB_SHA" xtask/models/chunks/ | wc -l)
          models=$(python3 -I -c 'import json; print(len(json.load(open("xtask/models.json"))["models"]))')
          uploaded=$(ls "$dir" | wc -l)
          [ "$committed" = "$models" ] && [ "$uploaded" = "$models" ] || {
            echo "$models models, $committed committed lists, $uploaded uploaded"; exit 1; }
          for f in "$dir"/*.chunks; do
            git cat-file -p "$GITHUB_SHA:xtask/models/chunks/$(basename "$f")" | cmp - "$f"
          done
          echo "the $uploaded lists in models-chunks-$VERSION are the commit's, and the pinned files' own" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The committed release repository verifies and lists this catalog (P4 task 18, interim)
        run: |
          if [ -f release/pkgrepo/metadata/1.root.json ]; then
            cargo xtask release-repo check | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no release/pkgrepo committed: this release imports no model" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Attest and draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [seq, sign, vm, release-boot, sign-script-macos]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Anchors outside the repository: the founder sets RELEASE_ROOT_KEY and
      # RELEASE_KEY in this protected environment (root-ceremony.md). Root must
      # name the one, and every other role the other, so a pull request that
      # brings keys of its own cannot ship as the founder's. Sessions could
      # rewrite the variables too, so the draft's notes also show both keys for
      # the founder to hold against the paper before publishing.
      - name: The release's keys are the ones the founder pinned
        id: keys
        env:
          ROOT_KEY: ${{ vars.RELEASE_ROOT_KEY }}
          RELEASE_KEY: ${{ vars.RELEASE_KEY }}
        run: |
          meta=release/pkgrepo/metadata
          if [ ! -f "$meta/1.root.json" ]; then
            [ -z "$ROOT_KEY$RELEASE_KEY" ] || { echo "the keys are pinned, but this release carries no root"; exit 1; }
            exit 0
          fi
          [ -n "$ROOT_KEY" ] && [ -n "$RELEASE_KEY" ] ||
            { echo "set both RELEASE_ROOT_KEY and RELEASE_KEY in the release environment (root-ceremony.md)"; exit 1; }
          # The one key a role names, at threshold 1, or nothing.
          role() { jq -r --arg r "$1" '.signed.roles[$r] as $x | if ($x.keyids | length) == 1 and $x.threshold == 1
            then .signed.keys[$x.keyids[0]].keyval.public else "" end' "$meta/1.root.json"; }
          pub() { openssl pkey -pubin -in "release/keys/$1.pub" -outform DER | tail -c 32 | od -An -v -tx1 | tr -d ' \n'; }
          test "$(jq -r '.signed.roles | keys | join(" ")' "$meta/1.root.json")" = "root snapshot targets timestamp"
          test "$(role root)" = "$ROOT_KEY"
          test "$(pub root)" = "$ROOT_KEY"
          for r in targets snapshot timestamp; do test "$(role "$r")" = "$RELEASE_KEY"; done
          test "$(pub release)" = "$RELEASE_KEY"
          # packages and models, as the one targets file delegates them.
          test "$(jq -r '[.signed.delegations.keys[].keyval.public] | unique | join(" ")' "$meta"/*.targets.json)" = "$RELEASE_KEY"
          echo "root $ROOT_KEY and release $RELEASE_KEY, as pinned"
          { echo "root=$ROOT_KEY"; echo "release=$RELEASE_KEY"; } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ env.VERSION }}
          path: release-assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Draft the GitHub Release; the founder publishes it by hand
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_KEY: ${{ steps.keys.outputs.root }}
          RELEASE_KEY: ${{ steps.keys.outputs.release }}
        run: |
          prerelease=$([[ "$VERSION" == *-rc.* ]] && echo --prerelease || true)
          # The asset RELEASE-NOTES.md is in SHA256SUMS, so the keys go only in
          # the draft's notes.
          notes="$RUNNER_TEMP/notes.md"
          cp release-assets/RELEASE-NOTES.md "$notes"
          if [ -n "$ROOT_KEY" ]; then
            {
              echo
              echo "## Signing keys"
              echo
              echo "- root: \`$ROOT_KEY\`"
              echo "- release: \`$RELEASE_KEY\`"
              echo
              echo "Before publishing: both must be the digits on the founder's paper (root-ceremony.md)."
            } >> "$notes"
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft --verify-tag $prerelease \
            --title "Kernel AI $VERSION" --notes-file "$notes" release-assets/*
      - name: Publish to kernel-ai-updates (stub until P4 task 18)
        run: |
          echo "stub: snapshot and timestamp are signed and published once the root ceremony is done"
