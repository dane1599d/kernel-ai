# An SBOM of the workspace (ADR 0009, P8 row 5's first part): cargo-cyclonedx
# 0.5.9 (Apache-2.0) writes one CycloneDX 1.5 JSON file per workspace package,
# and the release's script (.github/release/sbom.sh) merges them into
# `kernel-ai.cdx.json`, which is uploaded as
# an artifact named `sbom-<commit>`. A second script step checks that the SBOM
# lists every crate (name and version) that NOTICES.txt lists, and fails if one
# is missing or a NOTICES line that looks like a crate does not parse.
# On `main` and by hand (Actions tab, "SBOM", Run workflow); a pull request
# runs it only when it changes this file or the script. It is not attached to a release and
# not signed: P8's release checklist takes the artifact from here.
name: SBOM

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/sbom.yml
      - .github/release/sbom.sh

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CYCLONEDX_VERSION: 0.5.9

# A newer push to the same pull request cancels its older run; a push to main
# or a dispatch is never cancelled.
concurrency:
  group: sbom-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sbom:
    name: SBOM (cargo-cyclonedx)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-cyclonedx
        run: cargo install --locked --version "$CYCLONEDX_VERSION" cargo-cyclonedx
      # The release's script (.github/release/sbom.sh): cargo-cyclonedx for every
      # workspace package and target, merged into one file.
      - name: Make the SBOM
        run: |
          mkdir -p sbom
          .github/release/sbom.sh sbom/kernel-ai.cdx.json
      - name: Check that it lists every crate NOTICES.txt lists
        run: |
          set -euo pipefail
          # The "Parts" list: "- name version: licence." lines are crates; the
          # rest (core, Limine, fonts, ...) have no Cargo.lock entry. Every line
          # is either parsed or named below, so a format change cannot quietly
          # shrink the check.
          crate='^- ([A-Za-z0-9_.-]+) ([0-9][^ :]*): '
          sed -n '/^Parts$/,/^Licence texts$/p' NOTICES.txt | grep -E '^- ' > "$RUNNER_TEMP/parts.txt"
          grep -E "$crate" "$RUNNER_TEMP/parts.txt" > "$RUNNER_TEMP/parsed.txt" || true
          grep -vE "$crate" "$RUNNER_TEMP/parts.txt" > "$RUNNER_TEMP/skipped.txt" || true
          echo "$(wc -l < "$RUNNER_TEMP/parsed.txt") crate lines parsed; $(wc -l < "$RUNNER_TEMP/skipped.txt") other parts skipped:"
          cut -c1-100 "$RUNNER_TEMP/skipped.txt"
          # A skipped line that starts like a crate ("- name 1.2") is one the
          # pattern failed to parse: stop, rather than leave it unchecked.
          looks=$(grep -E '^- [A-Za-z0-9_.-]+ [0-9]' "$RUNNER_TEMP/skipped.txt" || true)
          if [ -n "$looks" ]; then
            echo "::error::NOTICES.txt lines that look like crates did not parse:"
            echo "$looks"
            exit 1
          fi
          test "$(( $(wc -l < "$RUNNER_TEMP/parsed.txt") + $(wc -l < "$RUNNER_TEMP/skipped.txt") ))" -eq "$(wc -l < "$RUNNER_TEMP/parts.txt")"
          sed -nE "s/$crate.*/\\1 \\2/p" "$RUNNER_TEMP/parsed.txt" | sort -u > "$RUNNER_TEMP/noticed.txt"
          jq -r '.components[] | "\(.name) \(.version)"' sbom/kernel-ai.cdx.json \
            | sort -u > "$RUNNER_TEMP/sbom.txt"
          echo "$(wc -l < "$RUNNER_TEMP/noticed.txt") crates in NOTICES.txt, $(wc -l < "$RUNNER_TEMP/sbom.txt") in the SBOM"
          test -s "$RUNNER_TEMP/noticed.txt"
          missing=$(comm -23 "$RUNNER_TEMP/noticed.txt" "$RUNNER_TEMP/sbom.txt")
          if [ -n "$missing" ]; then
            echo "::error::NOTICES.txt lists crates the SBOM does not:"
            echo "$missing"
            exit 1
          fi
          echo "every crate in NOTICES.txt is in the SBOM"
      - name: Upload the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom/kernel-ai.cdx.json
          if-no-files-found: error
          retention-days: 90
