# Board-shaped boots (P6 G56): the core cases on QEMU shaped like a real AM5
# board, not ci.yml's `-machine q35 -cpu max`, which no board guarantees.
#
# - `genoa`: `--cpu-model EPYC-Genoa`, Zen 4, the founder's 7700X's core. Under
#   KVM only on an AMD runner (an Intel one says so and boots nothing); under
#   TCG on any runner. TCG lacks some of Genoa's features (AVX-512 among
#   them), and QEMU's warning names each one it drops.
# - `no-8042`: `--no-8042`, q35 with `i8042=off`, so QEMU's FADT says there is
#   no 8042. The `no-8042` case itself, which ci.yml boots on every run, checks
#   the kernel's skip line and that the USB keyboard still types; here every
#   core case boots without one.
#
# Weekly and by workflow_dispatch; never a gate.
name: board shapes

on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-shapes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qemu:
    name: QEMU in the cache
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/qemu

  prebuild:
    name: Build the boot artifacts once
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.build.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: qemu
          save-if: false
      - id: build
        run: |
          cargo xtask build --spikes --out "$RUNNER_TEMP/prebuilt"
          echo "sha=$(sha256sum "$RUNNER_TEMP/prebuilt/manifest.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prebuilt
          path: ${{ runner.temp }}/prebuilt
          retention-days: 3
    timeout-minutes: 30

  boot:
    name: Core cases (${{ matrix.shape }}, ${{ matrix.accel }})
    runs-on: ubuntu-24.04
    needs: [qemu, prebuild]
    strategy:
      fail-fast: false
      matrix:
        shape: [genoa, no-8042]
        accel: [kvm, tcg]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Host facts
        id: host
        run: |
          vendor=$(grep -m1 '^vendor_id' /proc/cpuinfo | cut -d: -f2 | xargs)
          echo "vendor=$vendor"
          grep -m1 '^model name' /proc/cpuinfo
          echo "vendor=$vendor" >> "$GITHUB_OUTPUT"
      - name: An Intel runner cannot run Genoa under KVM
        if: matrix.shape == 'genoa' && matrix.accel == 'kvm' && steps.host.outputs.vendor != 'AuthenticAMD'
        run: echo "::notice::${{ steps.host.outputs.vendor }} runner; Genoa under KVM needs an AMD host, so nothing boots in this job"
      - uses: ./.github/actions/qemu
      - name: Allow KVM for the runner user
        if: matrix.accel == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: qemu
          save-if: false
      - name: Fetch the locked crates
        run: cargo fetch --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prebuilt
          path: ${{ runner.temp }}/prebuilt
      - name: Boot the core cases
        if: matrix.shape != 'genoa' || matrix.accel != 'kvm' || steps.host.outputs.vendor == 'AuthenticAMD'
        env:
          SHAPE: ${{ matrix.shape }}
          ACCEL: ${{ matrix.accel }}
          PREBUILT_SHA: ${{ needs.prebuild.outputs.sha }}
        run: |
          case "$SHAPE" in
            genoa) shape=(--cpu-model EPYC-Genoa) ;;
            no-8042) shape=(--no-8042) ;;
          esac
          failed=()
          for case in boot timer sched watchdog smp tlb storm fpu probe handles threads matvec entropy-boots devices usb-tablet no-8042; do
            echo "::group::$case"
            if ! XTASK_CASE="$case" cargo xtask test --accel "$ACCEL" --timeout 300 "${shape[@]}" \
                --prebuilt "$RUNNER_TEMP/prebuilt" --prebuilt-sha "$PREBUILT_SHA"; then
              failed+=("$case")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::failed with $SHAPE under $ACCEL: ${failed[*]}"
            exit 1
          fi
    timeout-minutes: 90
