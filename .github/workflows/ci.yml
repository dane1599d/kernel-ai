name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` lets adding `full-ci` start the boot jobs on a PR.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels that PR's older run; runs on main all finish.
# Adding any other label (`batch-ready`, `batch-first`) starts a run of its own
# group whose jobs all skip, so it neither cancels the PR's run nor costs a slot.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}${{ github.event.action == 'labeled' && !startsWith(github.event.label.name, 'full-ci') && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-unit:
    name: Format, lint, host unit tests
    if: github.event.action != 'labeled' || startsWith(github.event.label.name, 'full-ci')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The DCO step reads every commit of the pull request.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      # What this run checks: everything on main and on a merge batch
      # (`batch/...`), and on a pull request unless it changes only docs (files
      # under docs/ or ending in .md, none of them read by Rust code), which
      # needs only DCO and the decision rows. Batches and main keep every gate.
      - name: What this run checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && [ "${HEAD_REF#batch/}" = "$HEAD_REF" ]; then
            changed=$(git diff --name-only "$BASE" "$HEAD")
            if ! grep -qvE '^docs/|\.md$' <<<"$changed"; then
              code=false
              # A doc that Rust code reads at build time (include_str! or
              # include_bytes!, e.g. a test over a runbook) is code: its test
              # guards it. Matched by file name, so a doubt builds.
              for f in $changed; do
                name=$(basename "$f" | sed 's/[.[\*^$]/\\&/g')
                if grep -rqE --include='*.rs' "include_(str|bytes)!\([^)]*$name\"" .; then
                  echo "$f is read by Rust code"
                  code=true
                fi
              done
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "builds, lints and tests the code: $code"
      # ADR 0009 D2: every commit of a pull request is signed off under DCO 1.1
      # (CONTRIBUTING.md), unless its author is a maintainer. `Co-Authored-By:`
      # and `Assisted-by:` trailers are not sign-offs, and AI tools never add one
      # (D3). A step here, not a workflow of its own: one job less per push.
      - name: DCO sign-off
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The maintainers as the base branch lists them, so a pull request
          # cannot add its own author; the PR's copy only before the file exists.
          maintainers=$(git show "$BASE:MAINTAINERS" 2>/dev/null || cat MAINTAINERS)
          emails=$(grep -oE '<[^<>]+>' <<<"$maintainers" | tr -d '<>')
          failed=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            name=$(git log -1 --format=%an "$commit")
            email=$(git log -1 --format=%ae "$commit")
            if grep -qxF -- "$email" <<<"$emails"; then
              continue
            fi
            if git log -1 --format=%B "$commit" | grep -qxF -- "Signed-off-by: $name <$email>"; then
              continue
            fi
            echo "::error::$commit by $name <$email> has no 'Signed-off-by: $name <$email>' (see CONTRIBUTING.md; use git commit -s)"
            failed=1
          done
          exit "$failed"
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        if: steps.scope.outputs.code == 'true'
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.scope.outputs.code == 'true'
        run: cargo fmt --all --check
      # One file per call: `bash -n a.sh b.sh` reads b.sh as a.sh's argument.
      - name: The merge batcher's scripts parse (scripts/batch)
        if: steps.scope.outputs.code == 'true'
        run: for f in scripts/batch/*.sh; do bash -n "$f" || exit 1; done
      - name: The merge batcher lands, resumes and tidies as it should (stub gh)
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/batch/test/run.sh
      - name: Dependency licences and advisories (deny.toml, ADR 0009 D6)
        if: steps.scope.outputs.code == 'true'
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny check licenses advisories
      - name: Every licence in the tree and graph is allowed and has its text (ADR 0009 D5)
        if: steps.scope.outputs.code == 'true'
        run: cargo xtask licences check
      # A new decision is a file in docs/decisions/rows/, not a row of decisions.md. On a
      # pull request the check also compares decisions.md with the base's, and fails if
      # it gained a row (--deny-new-rows: the last PR that appended one landed 11-11).
      - name: Decision rows are well formed and decisions.md gains no row
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            cargo xtask decisions check --base FETCH_HEAD --deny-new-rows
          else
            cargo xtask decisions check
          fi
      # P4 task 18: the founder-signed root is frozen once committed. `updated`
      # keeps a cached root of the same version, so a second "version 1" would
      # split devices (docs/release/root-ceremony.md, "Interim: key files").
      - name: release/pkgrepo's root files never change once committed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) git fetch --no-tags --depth=1 origin "$BASE_REF" ;;
            push) git fetch --no-tags --depth=1 origin "$BEFORE" ;;
            *) exit 0 ;;
          esac
          for root in $(git ls-tree --name-only FETCH_HEAD release/pkgrepo/metadata/ | grep '\.root\.json$' || true); do
            if ! git diff --quiet FETCH_HEAD HEAD -- "$root"; then
              echo "$root is frozen once committed: never sign it again or remove it"
              exit 1
            fi
          done
      # A change to the catalog, its chunk lists, kaipkg, kaituf or pkgrepo can
      # break the committed repository; it would otherwise show only at a tag.
      - name: The committed release repository still checks out
        if: steps.scope.outputs.code == 'true'
        run: |
          if [ -f release/pkgrepo/metadata/1.root.json ]; then
            cargo xtask release-repo check
          fi
      - name: NOTICES.txt is up to date (ADR 0009 D6)
        if: steps.scope.outputs.code == 'true'
        run: |
          cargo install --locked cargo-about --version 0.9.2 --features cli
          cargo xtask notices --check
      # Host crates are the workspace's default-members (Cargo.toml), so a new
      # crate is linted and tested here without editing this file.
      - if: steps.scope.outputs.code == 'true'
        run: cargo clippy --all-targets --features linetable/alloc,kaibundle/alloc -- -D warnings
      - if: steps.scope.outputs.code == 'true'
        run: cargo clippy -p kernel --target x86_64-unknown-none --features spikes -- -D warnings
      - name: Clippy for the engine crates on the soft-float kernel target
        if: steps.scope.outputs.code == 'true'
        run: cargo clippy -p gguf -p cpufeat -p quant -p bpe -p infer --target x86_64-unknown-none -- -D warnings
      - name: Clippy for the soft-float ring-3 programs
        if: steps.scope.outputs.code == 'true'
        run: cargo clippy -p user --target x86_64-unknown-none --lib --bin supervisor --bin shell --bin crasher --bin spinner --bin hog --bin edit --bin work --bin netcheck --bin handles --bin scriptrun --bin fs --bin filecheck --bin deskdemo --bin tufbench -- -D warnings
      - name: Clippy for the hard-float ring-3 programs
        if: steps.scope.outputs.code == 'true'
        run: |
          # appbench embeds the view guest; wasmhost's tests load Notes' window.
          cargo build -p comp-viewbench --target wasm32-unknown-unknown --profile component
          cargo build -p comp-notes-window --target wasm32-unknown-unknown --profile component
          cargo build -p comp-files-window --target wasm32-unknown-unknown --profile component
          cargo build -p comp-settings-window --target wasm32-unknown-unknown --profile component
          cargo build -p comp-grant-fixture --target wasm32-unknown-unknown --profile component
          cargo build -p comp-net-fixture --target wasm32-unknown-unknown --profile component
          cargo build -p comp-wait-fixture --target wasm32-unknown-unknown --profile component
          cargo build -p comp-terminal-window --target wasm32-unknown-unknown --profile component
          cargo build -p comp-monitor-window --target wasm32-unknown-unknown --profile component
          cargo build -p comp-models-window --target wasm32-unknown-unknown --profile component
          cargo build -p comp-editor-window --target wasm32-unknown-unknown --profile component
          cargo clippy -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -p user --target user/x86_64-kai-user.json --lib --bin llm --bin desktop --bin probe --bin vecstress --bin workers --bin comphost --bin appbench --bin term --bin cc --bin pkg --bin updated --bin httpscheck --bin fetch --bin dlcheck -- -D warnings
      # termcore and the Terminal app's model are no_std and build for wasm32 (P4 task 4; the model lane reviews).
      - if: steps.scope.outputs.code == 'true'
        run: cargo clippy -p compsdk -p comp-notes -p comp-notes-v1 -p comp-viewbench -p termcore -p comp-terminal --target wasm32-unknown-unknown -- -D warnings
      # Alone: with comp-notes in the same run its exports would be on.
      - if: steps.scope.outputs.code == 'true'
        run: cargo clippy -p comp-notes-window --target wasm32-unknown-unknown -- -D warnings
      - if: steps.scope.outputs.code == 'true'
        run: cargo clippy -p comp-ui-bind -p comp-files-window -p comp-settings-window -p comp-terminal-window -p comp-monitor-window -p comp-models-window -p comp-grant-fixture -p comp-net-fixture -p comp-wait-fixture --target wasm32-unknown-unknown -- -D warnings
      - if: steps.scope.outputs.code == 'true'
        run: cargo clippy -p comp-editor-ui -p comp-editor-window --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy for each broken notes version
        if: steps.scope.outputs.code == 'true'
        run: for bug in bug-import bug-health bug-trap bug-spin; do cargo clippy -p comp-notes-bad --target wasm32-unknown-unknown --features $bug -- -D warnings; done
      - if: steps.scope.outputs.code == 'true'
        run: cargo test --features linetable/alloc,kaibundle/alloc

  # QEMU for every boot job, built once per version from a pinned source tarball
  # and cached: Ubuntu 24.04's QEMU 8.2 segfaulted under TCG in vector-heavy
  # cases (matvec, local-ask, local-script). Bump the version and SHA-256 here,
  # in release.yml and in .github/actions/qemu together; the build itself is
  # .github/actions/qemu/build.sh, which release.yml runs on a cache miss.
  #
  # The boot, icount and observe jobs all need this one, so this condition gates
  # them too (founder, 2026-10-27): they run on main, on merge-batch PRs
  # (`batch/...`), and on a PR labelled `full-ci`. A plain PR push runs only the
  # lint and host-test job above; merges still need every job green in a batch.
  #
  # A `full-ci` PR boots its cases under KVM only, without the TCG shards, icount
  # or observe: those ran on every lane's PR and starved the merge batches of the
  # account's 20 job slots (2026-10-27). Batches and main still run everything,
  # and a PR labelled `full-ci-all` gets the whole set too, e.g. to chase a TCG hang.
  # Whether this run may skip the boot jobs: only a `batch/noboot-...` run, and
  # only when main's copy of scripts/batch/noboot.sh finds that nothing the
  # change touches reaches the image or the boot runs. The answer comes from
  # the diff, never from a name, flag or title a PR's author sets; a wrong
  # name, an error or a rule that disagrees means `skip=false` and every boot
  # job runs. Any other run skips this job and its `qemu` starts at once.
  noboot:
    name: No-boot check (scripts/batch/noboot.sh)
    if: startsWith(github.head_ref, 'batch/noboot-')
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.rule.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: rule
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          skip=false
          # main's copy of the rule, never the batch's own: a change to the rule
          # must not judge itself (and noboot.sh sends scripts/batch/ to a full batch).
          if git show "$BASE:scripts/batch/noboot.sh" > "$RUNNER_TEMP/noboot.sh" 2>/dev/null \
             && bash "$RUNNER_TEMP/noboot.sh" "$BASE" "$HEAD"; then
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "the boot jobs are skipped: $skip"

  qemu:
    name: QEMU 11.0.5 (built once, cached)
    # A no-boot batch boots nothing, when the `noboot` job above says so from
    # its diff. `!cancelled()` lets this run when that job is skipped.
    needs: noboot
    if: >-
      !cancelled() &&
      needs.noboot.outputs.skip != 'true' &&
      (github.event.action != 'labeled' || startsWith(github.event.label.name, 'full-ci')) &&
      (github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'batch/') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci-all'))
    runs-on: ubuntu-24.04
    env:
      QEMU_VERSION: "11.0.5"
      QEMU_SHA256: 38a1a09f349660cb0e20b8fe5f224d6a53ec4235eb36f2e33a31e21bb6138147
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/qemu
          key: qemu-${{ env.QEMU_VERSION }}-ubuntu-24.04-v1
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
      - name: Build QEMU ${{ env.QEMU_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash .github/actions/qemu/build.sh
      - name: Save QEMU ${{ env.QEMU_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/qemu
          key: qemu-${{ env.QEMU_VERSION }}-ubuntu-24.04-v1
    timeout-minutes: 40

  # Every case boots under both KVM and TCG (KVM only on a `full-ci` PR, see
  # above); `--shard K/3` deals the cases out in turn across three runners per
  # accelerator, and shard 1 also runs the host smokes.
  boot:
    name: Boot test (${{ matrix.accel }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    needs: qemu
    # Explicit: a job's implicit success() covers its needs' needs too, and the
    # `noboot` job above `qemu` is skipped on every run but a no-boot batch.
    if: ${{ !cancelled() && needs.qemu.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        accel: ${{ fromJSON(github.event_name == 'pull_request' && !startsWith(github.head_ref, 'batch/') && !contains(github.event.pull_request.labels.*.name, 'full-ci-all') && '["kvm"]' || '["kvm", "tcg"]') }}
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qemu
      - name: Show the runner's CPU count, vector features, vendor and nested virtualisation
        run: |
          nproc
          grep -m1 '^flags' /proc/cpuinfo | grep -o -w -E 'avx2|avx512f|avx512bw|avx512_vnni' | xargs echo
          # ADR 0006 step 1: which runners could host an SVM guest under KVM.
          grep -m1 '^vendor_id' /proc/cpuinfo
          grep -m1 '^model name' /proc/cpuinfo
          echo "virtualisation flags: $(grep -m1 '^flags' /proc/cpuinfo | grep -o -w -E 'svm|vmx|npt|nrip_save|decodeassists|avic' | xargs echo)"
          for module in kvm_amd kvm_intel; do
            if [ -r /sys/module/$module/parameters/nested ]; then
              echo "$module nested=$(cat /sys/module/$module/parameters/nested)"
            fi
          done
      - name: Allow KVM for the runner user
        if: matrix.accel == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: qemu
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.accel == 'kvm' && matrix.shard == 1 }}
      - name: Boot kernel with spikes and check pass/fail
        run: cargo xtask test --accel ${{ matrix.accel }} --timeout 300 --shard ${{ matrix.shard }}/3
    # TCG shards run about twice as long as KVM ones: on 2026-10-28 main's slowest
    # TCG shard took 19 of its 20 minutes, and batch #340's timed out mid-case.
    # On 2026-10-30 KVM shards took 16-18 minutes with 45 cases each, and two
    # hit the 20-minute limit on #460, so both limits got room for new cases.
    # On 2026-11-03 batch #591's KVM shard 2 hit 30 minutes: an 11-minute build
    # (the batch changed llmproto and shellcore, so little was cached) plus 18
    # minutes of cases, all passing, against main's 4 and 16.
    # On 2026-11-18 a batch of 10 PRs took TCG shards 39, 47 and 50+ minutes
    # (run 44386984913, shard 1 cut off at the limit), so TCG gets 75.
    timeout-minutes: ${{ matrix.accel == 'tcg' && 75 || 45 }}

  # Performance pass marks, judged on the release kernel (decisions, 2026-10-27):
  # the boot jobs' debug kernel leaves the `kernel` crate unoptimised, so its
  # figures are the trend line only. Runs on main and on `full-ci` PRs, not on
  # merge batches, and is not a gate: it reports. `shm` logs spike S01-1's M6.
  perf:
    name: Perf marks (release kernel)
    if: >-
      !cancelled() && needs.qemu.result == 'success' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-24.04
    needs: qemu
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qemu
      - name: Allow KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: qemu-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Boot the release kernel and log the perf marks
        env:
          XTASK_CASE: shm
        run: cargo xtask test --release --accel kvm --timeout 300
      # The same with the TSC as the clock: every HPET read exits to the host.
      - name: The perf marks again with clock=tsc
        env:
          XTASK_CASE: shm
          XTASK_CMDLINE: clock=tsc
        run: cargo xtask test --release --accel kvm --timeout 300
    timeout-minutes: 30

  # M10a-2's spike, not a gate: boots `icount-probe` twice under single-threaded
  # TCG with icount and requires the same digest; it also prints host seconds per
  # virtual second, which fixes shift and the trial's window length.
  # Not a gate, so not on merge batches either (2026-11-19: 6-10 runner minutes
  # and a job slot per batch, while batches queue for runners): it runs on main
  # pushes, where a drift shows the commit that brought it, and on a PR
  # labelled `full-ci-all`.
  icount:
    name: icount determinism probe (not a gate)
    if: >-
      !cancelled() && needs.qemu.result == 'success' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci-all'))
    runs-on: ubuntu-24.04
    needs: qemu
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qemu
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: qemu
          save-if: false
      - name: Boot icount-probe twice and compare digests
        run: cargo xtask icount --shift 3 --boots 2 --timeout 900
    timeout-minutes: 45

  # The M10 exit test's recording names the summary an observe boot built, and
  # `tune ab` refuses it unless a new observe boot builds it again, on another
  # runner. Each of two runners boots observe twice; all four summaries must match.
  observe:
    name: Observe determinism (${{ matrix.runner }})
    if: >-
      !cancelled() && needs.qemu.result == 'success' &&
      (github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'batch/') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci-all'))
    runs-on: ubuntu-24.04
    needs: qemu
    strategy:
      fail-fast: false
      matrix:
        runner: [first, second]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qemu
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: qemu
          save-if: false
      - name: Boot observe twice and compare summaries
        run: |
          set -o pipefail
          cargo xtask tune observe --mix A --boots 2 --timeout 900 | tee observe.txt
          grep -o 'built the same summary [0-9a-f]*' observe.txt | awk '{print $5}' > summary-sha.txt
          test -s summary-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: observe-${{ matrix.runner }}
          path: summary-sha.txt
    timeout-minutes: 45

  observe-compare:
    name: Observe determinism across runners
    runs-on: ubuntu-24.04
    needs: observe
    if: ${{ !cancelled() && needs.observe.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
      - name: Both runners built the same summary
        run: |
          cat observe-first/summary-sha.txt observe-second/summary-sha.txt
          cmp observe-first/summary-sha.txt observe-second/summary-sha.txt
