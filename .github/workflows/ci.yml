name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels that PR's older run; runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-unit:
    name: Format, lint, host unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Dependency licences and advisories (deny.toml, ADR 0009 D6)
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny check licenses advisories
      - name: Every licence in the tree and graph is allowed and has its text (ADR 0009 D5)
        run: cargo xtask licences check
      - name: NOTICES.txt is up to date (ADR 0009 D6)
        run: |
          cargo install --locked cargo-about --version 0.9.2 --features cli
          cargo xtask notices --check
      - run: cargo clippy -p agentabi -p appabi -p xtask -p captable -p gguf -p cpufeat -p quant -p bpe -p infer -p linetable -p mm -p netcore -p nvme -p xhci -p acpitables -p pci -p devmatch -p devkit -p sched -p llmproto -p kabi -p supervise -p uelf -p shellcore -p livecore -p editcore -p gfxcore -p termcore -p wasmhost -p wasihost -p compsdk -p comp-notes -p comp-notes-v1 -p comp-notes-bad --all-targets --features linetable/alloc -- -D warnings
      - run: cargo clippy -p kernel --target x86_64-unknown-none --features spikes -- -D warnings
      - name: Clippy for the engine crates on the soft-float kernel target
        run: cargo clippy -p gguf -p cpufeat -p quant -p bpe -p infer --target x86_64-unknown-none -- -D warnings
      - name: Clippy for the soft-float ring-3 programs
        run: cargo clippy -p user --target x86_64-unknown-none --lib --bin supervisor --bin shell --bin crasher --bin spinner --bin hog --bin comphost --bin edit --bin work --bin netcheck --bin handles --bin hashbench -- -D warnings
      - name: Clippy for the hard-float ring-3 programs
        run: cargo clippy -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -p user --target user/x86_64-kai-user.json --lib --bin llm --bin probe --bin vecstress --bin workers -- -D warnings
      - run: cargo clippy -p compsdk -p comp-notes -p comp-notes-v1 --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy for each broken notes version
        run: for bug in bug-import bug-health bug-trap bug-spin; do cargo clippy -p comp-notes-bad --target wasm32-unknown-unknown --features $bug -- -D warnings; done
      - run: cargo test -p agentabi -p appabi -p xtask -p captable -p gguf -p cpufeat -p quant -p bpe -p infer -p linetable -p mm -p netcore -p nvme -p xhci -p acpitables -p pci -p devmatch -p devkit -p sched -p llmproto -p kabi -p supervise -p uelf -p shellcore -p livecore -p editcore -p gfxcore -p termcore -p wasmhost -p wasihost -p compsdk -p comp-notes -p comp-notes-v1 -p comp-notes-bad --features linetable/alloc

  # Spike S04-1 (ADR 0004), on the never-merged branch spike/kaifs only: host
  # tests, no VM. The boot, icount and observe jobs are dropped on this branch.
  kaifs:
    name: S04-1 kaifs crash core (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p spike-kaifs --all-targets -- -D warnings
      - name: The spike's tests and measurements
        run: cargo test --release -p spike-kaifs -- --nocapture --test-threads 1
      - name: SHA-256 in portable code (the ADR's bar)
        run: RUSTFLAGS='--cfg sha2_backend="soft"' CARGO_TARGET_DIR=target/soft cargo test --release -p spike-kaifs --test measure checksum -- --nocapture
    timeout-minutes: 90

  # The in-target checksum figure: `hashbench`, a soft-float ring-3 program as
  # `fs` will be, booted under KVM and TCG (release builds, as the image ships).
  hashbench:
    name: S04-1 boot test=hashbench (${{ matrix.accel }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        accel: [kvm, tcg]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qemu
      - name: Allow KVM for the runner user
        if: matrix.accel == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The runner's CPU
        run: grep -m1 '^model name' /proc/cpuinfo; grep -m1 '^flags' /proc/cpuinfo | grep -o -w sha_ni || echo "no sha_ni"
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: qemu
          save-if: false
      - name: Boot test=hashbench
        run: |
          set -o pipefail
          XTASK_CASE=hashbench cargo xtask test --release --accel ${{ matrix.accel }} --timeout 600 | tee boot.log
      - name: The figures
        if: always()
        run: grep -h 'hashbench:' boot.log | sed 's/^ *| //'
    timeout-minutes: 45
