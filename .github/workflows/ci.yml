name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels that PR's older run; runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-unit:
    name: Format, lint, host unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Dependency licences and advisories (deny.toml, ADR 0009 D6)
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny check licenses advisories
      - name: Every licence in the tree and graph is allowed and has its text (ADR 0009 D5)
        run: cargo xtask licences check
      - name: NOTICES.txt is up to date (ADR 0009 D6)
        run: |
          cargo install --locked cargo-about --version 0.9.2 --features cli
          cargo xtask notices --check
      - run: cargo clippy -p spike-kaifs -p spike-store-switch --all-targets -- -D warnings

  # Spike S11-2's host half (ADR 0011), on the never-merged branch
  # spike/store-switch only: the package store's switch over S04-1's kaifs
  # engine and over design C's three primitives, 10,000 random sequences each,
  # crashed at every write, flush and commit. Host tests, no VM, no model. The
  # boot, icount and observe jobs are dropped on this branch.
  store-switch:
    name: S11-2 store switch (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: The harness and its figures
        run: cargo test --release -p spike-store-switch -- --nocapture --test-threads 4
    timeout-minutes: 45
