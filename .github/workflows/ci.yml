name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels that PR's older run; runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-unit:
    name: Format, lint, host unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Dependency licences and advisories (deny.toml, ADR 0009 D6)
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny check licenses advisories
      - name: Every licence in the tree and graph is allowed and has its text (ADR 0009 D5)
        run: cargo xtask licences check
      - name: NOTICES.txt is up to date (ADR 0009 D6)
        run: |
          cargo install --locked cargo-about --version 0.9.2 --features cli
          cargo xtask notices --check
      - run: cargo clippy -p kernel --target x86_64-unknown-none -- -D warnings
      - run: cargo clippy -p xtask --all-targets -- -D warnings
      - run: cargo test -p xtask

  # QEMU for every boot job, built once per version from a pinned source tarball
  # and cached: Ubuntu 24.04's QEMU 8.2 segfaulted under TCG in vector-heavy
  # cases (matvec, local-ask, local-script). Bump the version and SHA-256 here
  # and in .github/actions/qemu together.
  qemu:
    name: QEMU 11.0.5 (built once, cached)
    runs-on: ubuntu-24.04
    env:
      QEMU_VERSION: "11.0.5"
      QEMU_SHA256: 38a1a09f349660cb0e20b8fe5f224d6a53ec4235eb36f2e33a31e21bb6138147
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/qemu
          key: qemu-${{ env.QEMU_VERSION }}-ubuntu-24.04-v1
          lookup-only: true
      - name: Build QEMU ${{ env.QEMU_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev libslirp-dev libfdt-dev flex bison
          curl -sSfL "https://download.qemu.org/qemu-$QEMU_VERSION.tar.xz" -o qemu.tar.xz
          echo "$QEMU_SHA256  qemu.tar.xz" | sha256sum -c -
          tar -xJf qemu.tar.xz
          cd "qemu-$QEMU_VERSION"
          ./configure --prefix="$HOME/qemu" --target-list=x86_64-softmmu --enable-slirp \
            --disable-docs --disable-gtk --disable-sdl --disable-opengl --disable-werror
          make -j"$(nproc)" install
          "$HOME/qemu/bin/qemu-system-x86_64" --version
      - name: Save QEMU ${{ env.QEMU_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/qemu
          key: qemu-${{ env.QEMU_VERSION }}-ubuntu-24.04-v1
    timeout-minutes: 40

  # Spike S04-3 (ADR 0004), raw half, on the never-merged branch spike/blk-flush
  # only: 200 raw commits to a `kai-data` disk behind QEMU's blklogwrites (GPL,
  # CI only, never shipped), the log replayed on the host at every flush point
  # and every crash state between; and the same with a flush skipped on purpose,
  # which the replay must catch. Release builds, under KVM and TCG. The full
  # lint, host-test, boot, icount and observe jobs are dropped on this branch.
  blk-flush:
    name: S04-3 boot test=blk-flush (${{ matrix.accel }})
    runs-on: ubuntu-24.04
    needs: qemu
    strategy:
      fail-fast: false
      matrix:
        accel: [kvm, tcg]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qemu
      - name: Allow KVM for the runner user
        if: matrix.accel == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: qemu
          save-if: false
      - name: Boot test=blk-flush and replay its log
        run: |
          set -o pipefail
          XTASK_CASE=blk-flush,blk-flush-bug cargo xtask test --release --accel ${{ matrix.accel }} --timeout 600 | tee boot.log
      - name: The figures
        if: always()
        run: |
          grep -h -E 'blk-flush|blk: disk' boot.log | sed 's/^ *| //'
    timeout-minutes: 45
