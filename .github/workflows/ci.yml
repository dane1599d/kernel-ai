name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-unit:
    name: Format, lint, host unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p xtask -p gguf -p cpufeat -p quant -p bpe -p infer -p linetable -p mm -p nvme -p acpitables -p sched -p llmproto -p kabi -p supervise -p uelf -p shellcore -p livecore -p editcore -p termcore -p wasmhost -p compsdk -p comp-notes -p comp-notes-v1 -p comp-notes-bad --all-targets --features linetable/alloc -- -D warnings
      - run: cargo clippy -p kernel --target x86_64-unknown-none --features spikes -- -D warnings
      - name: Clippy for the engine crates on the soft-float kernel target
        run: cargo clippy -p gguf -p cpufeat -p quant -p bpe -p infer --target x86_64-unknown-none -- -D warnings
      - name: Clippy for the soft-float ring-3 programs
        run: cargo clippy -p user --target x86_64-unknown-none --lib --bin supervisor --bin shell --bin crasher --bin spinner --bin hog --bin comphost --bin edit --bin work -- -D warnings
      - name: Clippy for the hard-float ring-3 programs
        run: cargo clippy -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -p user --target user/x86_64-kai-user.json --lib --bin llm --bin probe --bin vecstress --bin workers -- -D warnings
      - run: cargo clippy -p compsdk -p comp-notes -p comp-notes-v1 --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy for each broken notes version
        run: for bug in bug-import bug-health bug-trap bug-spin; do cargo clippy -p comp-notes-bad --target wasm32-unknown-unknown --features $bug -- -D warnings; done
      - run: cargo test -p xtask -p gguf -p cpufeat -p quant -p bpe -p infer -p linetable -p mm -p nvme -p acpitables -p sched -p llmproto -p kabi -p supervise -p uelf -p shellcore -p livecore -p editcore -p termcore -p wasmhost -p compsdk -p comp-notes -p comp-notes-v1 -p comp-notes-bad --features linetable/alloc

  boot:
    name: Boot test (${{ matrix.accel }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        accel: [kvm, tcg]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Show the runner's CPU count and vector features
        run: |
          nproc
          grep -m1 '^flags' /proc/cpuinfo | grep -o -w -E 'avx2|avx512f|avx512bw|avx512_vnni' | xargs echo
      - name: Allow KVM for the runner user
        if: matrix.accel == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Boot kernel with spikes and check pass/fail
        run: cargo xtask test --accel ${{ matrix.accel }} --timeout 300
    timeout-minutes: 30

  # M10a-2's spike, not a gate: boots `icount-probe` twice under single-threaded
  # TCG with icount and requires the same digest; it also prints host seconds per
  # virtual second, which fixes shift and the trial's window length.
  icount:
    name: icount determinism probe (not a gate)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Boot icount-probe twice and compare digests
        run: cargo xtask icount --shift 3 --boots 2 --timeout 900
    timeout-minutes: 45

  # The M10 exit test's recording names the summary an observe boot built, and
  # `tune ab` refuses it unless a new observe boot builds it again, on another
  # runner. Each of two runners boots observe twice; all four summaries must match.
  observe:
    name: Observe determinism (${{ matrix.runner }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runner: [first, second]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Boot observe twice and compare summaries
        run: |
          set -o pipefail
          cargo xtask tune observe --mix A --boots 2 --timeout 900 | tee observe.txt
          grep -o 'built the same summary [0-9a-f]*' observe.txt | awk '{print $5}' > summary-sha.txt
          test -s summary-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: observe-${{ matrix.runner }}
          path: summary-sha.txt
    timeout-minutes: 45

  observe-compare:
    name: Observe determinism across runners
    runs-on: ubuntu-24.04
    needs: observe
    steps:
      - uses: actions/download-artifact@v4
      - name: Both runners built the same summary
        run: |
          cat observe-first/summary-sha.txt observe-second/summary-sha.txt
          cmp observe-first/summary-sha.txt observe-second/summary-sha.txt
