name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels that PR's older run; runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-unit:
    name: Format, lint, host unit tests
    runs-on: ubuntu-24.04
    # Spike S12-1: ccspike embeds cc.wasm, so lint needs the ccwasm job's artifact.
    needs: ccwasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ccwasm
          path: target/ccwasm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Dependency licences and advisories (deny.toml, ADR 0009 D6)
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny check licenses advisories
      - name: Every licence in the tree and graph is allowed and has its text (ADR 0009 D5)
        run: cargo xtask licences check
      - name: NOTICES.txt is up to date (ADR 0009 D6)
        run: |
          cargo install --locked cargo-about --version 0.9.2 --features cli
          cargo xtask notices --check
      - run: cargo clippy -p agentabi -p appabi -p xtask -p captable -p gguf -p cpufeat -p quant -p bpe -p infer -p linetable -p mm -p netcore -p nvme -p xhci -p acpitables -p pci -p devmatch -p devkit -p sched -p llmproto -p kabi -p supervise -p uelf -p shellcore -p livecore -p editcore -p gfxcore -p termcore -p wasmhost -p compsdk -p comp-notes -p comp-notes-v1 -p comp-notes-bad --all-targets --features linetable/alloc -- -D warnings
      - run: cargo clippy -p kernel --target x86_64-unknown-none --features spikes -- -D warnings
      - name: Clippy for the engine crates on the soft-float kernel target
        run: cargo clippy -p gguf -p cpufeat -p quant -p bpe -p infer --target x86_64-unknown-none -- -D warnings
      - name: Clippy for the soft-float ring-3 programs
        run: cargo clippy -p user --target x86_64-unknown-none --lib --bin supervisor --bin shell --bin crasher --bin spinner --bin hog --bin comphost --bin edit --bin work --bin netcheck --bin handles -- -D warnings
      - name: Clippy for the hard-float ring-3 programs
        run: cargo clippy -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -p user --target user/x86_64-kai-user.json --lib --bin llm --bin probe --bin vecstress --bin workers --bin ccspike -- -D warnings
      - name: S12-1 host tests (wasihost, kailink, and the spike on the host's cc.wasm)
        run: |
          cargo clippy -p wasihost -p kailink -p spike-ccspike --all-targets -- -D warnings
          cargo test -p wasihost -p kailink
          cargo test --release -p spike-ccspike -- --nocapture
      - run: cargo clippy -p compsdk -p comp-notes -p comp-notes-v1 --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy for each broken notes version
        run: for bug in bug-import bug-health bug-trap bug-spin; do cargo clippy -p comp-notes-bad --target wasm32-unknown-unknown --features $bug -- -D warnings; done
      - run: cargo test -p agentabi -p appabi -p xtask -p captable -p gguf -p cpufeat -p quant -p bpe -p infer -p linetable -p mm -p netcore -p nvme -p xhci -p acpitables -p pci -p devmatch -p devkit -p sched -p llmproto -p kabi -p supervise -p uelf -p shellcore -p livecore -p editcore -p gfxcore -p termcore -p wasmhost -p compsdk -p comp-notes -p comp-notes-v1 -p comp-notes-bad --features linetable/alloc

  # QEMU for every boot job, built once per version from a pinned source tarball
  # and cached: Ubuntu 24.04's QEMU 8.2 segfaulted under TCG in vector-heavy
  # cases (matvec, local-ask, local-script). Bump the version and SHA-256 here
  # and in .github/actions/qemu together.
  qemu:
    name: QEMU 11.0.5 (built once, cached)
    runs-on: ubuntu-24.04
    env:
      QEMU_VERSION: "11.0.5"
      QEMU_SHA256: 38a1a09f349660cb0e20b8fe5f224d6a53ec4235eb36f2e33a31e21bb6138147
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/qemu
          key: qemu-${{ env.QEMU_VERSION }}-ubuntu-24.04-v1
          lookup-only: true
      - name: Build QEMU ${{ env.QEMU_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev libslirp-dev libfdt-dev flex bison
          curl -sSfL "https://download.qemu.org/qemu-$QEMU_VERSION.tar.xz" -o qemu.tar.xz
          echo "$QEMU_SHA256  qemu.tar.xz" | sha256sum -c -
          tar -xJf qemu.tar.xz
          cd "qemu-$QEMU_VERSION"
          ./configure --prefix="$HOME/qemu" --target-list=x86_64-softmmu --enable-slirp \
            --disable-docs --disable-gtk --disable-sdl --disable-opengl --disable-werror
          make -j"$(nproc)" install
          "$HOME/qemu/bin/qemu-system-x86_64" --version
      - name: Save QEMU ${{ env.QEMU_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/qemu
          key: qemu-${{ env.QEMU_VERSION }}-ubuntu-24.04-v1
    timeout-minutes: 40

  # Spike S12-1 (ADR 0012), on the never-merged branch spike/cc-wasm only: the
  # boot, icount and observe jobs are dropped here to keep CI runs to the spike.
  ccwasm:
    name: S12-1 cc.wasm from xcc (gen2 == gen3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: llvm-ar for wcc's libc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm
      - run: cargo xtask ccwasm
      - uses: actions/upload-artifact@v4
        with:
          name: ccwasm
          path: target/ccwasm
    timeout-minutes: 30

  # S12-1's boot case: under KVM five boots (p50/p95 across boots come from the
  # five logs), under TCG one boot with one compile per entry (reported only).
  ccspike:
    name: S12-1 boot test=ccspike (${{ matrix.accel }})
    runs-on: ubuntu-24.04
    needs: [qemu, ccwasm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - accel: kvm
            case: ccspike
            boots: 5
          - accel: tcg
            case: ccspike-quick
            boots: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qemu
      - name: Allow KVM for the runner user
        if: matrix.accel == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: qemu
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          name: ccwasm
          path: target/ccwasm
      - name: Show the runner's CPU
        run: |
          nproc
          grep -m1 '^model name' /proc/cpuinfo
      # Release builds, as the image ships; every boot runs even if one fails.
      - name: Boot test=ccspike
        run: |
          failed=0
          for boot in $(seq ${{ matrix.boots }}); do
            XTASK_CASE=${{ matrix.case }} cargo xtask test --release --accel ${{ matrix.accel }} --timeout 1500 > boot-$boot.log 2>&1 || failed=$((failed + 1))
            grep -h 'ccspike:' boot-$boot.log | sed 's/^ *| //' | tail -n 40
          done
          echo "boots failed: $failed of ${{ matrix.boots }}"
          test "$failed" -eq 0
      - name: The measurements
        if: always()
        run: grep -h 'ccspike:' boot-*.log | sed 's/^ *| //' | tee ccspike-${{ matrix.accel }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ccspike-${{ matrix.accel }}
          path: ccspike-${{ matrix.accel }}.txt
    timeout-minutes: 120
