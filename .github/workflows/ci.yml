name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-unit:
    name: Format, lint, host unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p xtask -p gguf -p cpufeat -p quant -p bpe -p infer -p linetable -p mm -p acpitables -p sched -p llmproto -p kabi -p supervise -p uelf -p shellcore -p livecore -p editcore -p termcore -p wasmhost -p compsdk -p comp-notes -p comp-notes-v1 -p comp-notes-bad --all-targets --features linetable/alloc -- -D warnings
      - run: cargo clippy -p kernel --target x86_64-unknown-none --features spikes -- -D warnings
      - name: Clippy for the engine crates on the soft-float kernel target
        run: cargo clippy -p gguf -p cpufeat -p quant -p bpe -p infer --target x86_64-unknown-none -- -D warnings
      - run: cargo clippy -p user --target x86_64-unknown-none --bins --lib -- -D warnings
      - run: cargo clippy -p compsdk -p comp-notes -p comp-notes-v1 --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy for each broken notes version
        run: for bug in bug-import bug-health bug-trap bug-spin; do cargo clippy -p comp-notes-bad --target wasm32-unknown-unknown --features $bug -- -D warnings; done
      - run: cargo test -p xtask -p gguf -p cpufeat -p quant -p bpe -p infer -p linetable -p mm -p acpitables -p sched -p llmproto -p kabi -p supervise -p uelf -p shellcore -p livecore -p editcore -p termcore -p wasmhost -p compsdk -p comp-notes -p comp-notes-v1 -p comp-notes-bad --features linetable/alloc

  boot:
    name: Boot test (${{ matrix.accel }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        accel: [kvm, tcg]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Allow KVM for the runner user
        if: matrix.accel == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Boot kernel with spikes and check pass/fail
        run: cargo xtask test --accel ${{ matrix.accel }} --timeout 300
    timeout-minutes: 30
