# The `kai-chunks 1` lists the `models` role signs beside each catalog model
# (P5 tasks 6 and 9, ADR 0008 §9): `xtask/models/chunks/<sha256>.chunks`,
# committed like the goldens. This job downloads every pinned GGUF of
# xtask/models.json, checks its SHA-256 (.github/release/fetch_models.py), and
# requires each committed list to be the file's own, 2 MiB chunk by chunk
# (`cargo xtask pkgrepo chunks`). When a list is missing or differs it writes
# them all and uploads them as the `model-chunks` artifact to commit. The
# models are only hashed, never run, and this runs on GitHub's runner only,
# never on the founder's PC. Every action is pinned by commit SHA.
name: model-chunks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - xtask/models.json
      - xtask/models/chunks/**
      - xtask/src/pkgrepo/chunks.rs
      - .github/release/fetch_models.py
      - .github/workflows/model-chunks.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: model-chunks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chunks:
    name: The catalog's chunk lists match the pinned files
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reuse the model files from an earlier run
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/kai-models
          key: model-chunks-${{ hashFiles('xtask/models.json') }}
      - name: Download every pinned model and check its SHA-256
        run: python3 -I .github/release/fetch_models.py "$RUNNER_TEMP/kai-models"
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: The committed lists are the files' own
        id: check
        continue-on-error: true
        run: cargo xtask pkgrepo chunks --models "$RUNNER_TEMP/kai-models"
      - name: Otherwise, write the lists to commit
        if: steps.check.outcome == 'failure'
        run: cargo xtask pkgrepo chunks --models "$RUNNER_TEMP/kai-models" --write
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.check.outcome == 'failure'
        with:
          name: model-chunks
          path: xtask/models/chunks
      - name: Fail until the lists are committed
        if: steps.check.outcome == 'failure'
        run: |
          echo "commit the model-chunks artifact as xtask/models/chunks/" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
