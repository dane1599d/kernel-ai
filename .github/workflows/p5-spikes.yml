# Spike P5-S1 `tls-nostd` (docs/plans/p5-networking.md §5), not for merge:
# rustls 0.23.46 without std on our RustCrypto provider (spikes/tls-nostd).
# - host: the no_std builds for both ring-3 targets, the host tests, the .text
#   the client adds (bar 600 KiB) at opt-level 3 and size-optimised, the host
#   bench, and interop with `openssl s_server` as a second implementation;
# - real-hosts: one TLS 1.3 handshake and one GET / to each of the plan's four
#   hosts, read-only, from the runner only (never the founder's PC);
# - boot: `test=tls-bench` under KVM, the handshake (bar 300 ms) and AES-GCM
#   (bar 200 MB/s) in hard-float ring 3, at both optimisation levels.
# No model runs anywhere here.
name: p5-spikes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - spikes/tls-nostd/**
      - user/src/bin/tls*.rs
      - kernel/src/tlsbench_tests.rs
      - .github/workflows/p5-spikes.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: p5-spikes-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    name: P5-S1 host (no_std builds, tests, .text, openssl interop)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: p5-s1-host
      - name: Host tests (handshakes on both chains, refusals, every suite, RSA vectors)
        run: cargo test -p spike-tls --features std
      - run: cargo clippy -p spike-tls --features std --all-targets -- -D warnings
      - name: Builds without std for the hard-float ring-3 target
        run: >
          cargo build -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem
          -p spike-tls --target user/x86_64-kai-user.json
      - name: Builds without std for the soft-float kernel target, with the portable poly1305 and curve25519 backends
        env:
          RUSTFLAGS: >-
            --cfg poly1305_backend="soft" --cfg curve25519_dalek_backend="serial"
            -C relocation-model=static -C code-model=kernel -C force-frame-pointers=yes
        run: cargo build -p spike-tls --target x86_64-unknown-none
      - name: The .text the TLS client adds to a release ring-3 program (bar 600 KiB)
        run: |
          size="$(find "$(rustc --print sysroot)" -name llvm-size -type f | head -1)"
          text() { "$size" -A "target/x86_64-kai-user/release/$1" | awk '$1 == ".text" { print $2 }'; }
          # "s" leaves the provider and the AEAD crates at 3 (Cargo.toml).
          for opt in 3 s; do
            CARGO_PROFILE_RELEASE_OPT_LEVEL=$opt cargo build --release -Zjson-target-spec \
              -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem \
              -p user --target user/x86_64-kai-user.json --features tls-spike --bin tlssize --bin tlsnone
            client=$(text tlssize); base=$(text tlsnone)
            echo "opt-level $opt: tlssize .text $client bytes, tlsnone $base: the TLS client adds $(( (client - base) / 1024 )) KiB (bar 600 KiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Host bench on the runner, for comparison with ring 3
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo run --release -p spike-tls --features std --bin tlshost | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Interop with openssl s_server (a second implementation; the runner's openssl, never shipped)
        run: |
          set -euo pipefail
          cargo build --release -p spike-tls --features std --bin tlsprobe
          probe="$GITHUB_WORKSPACE/target/release/tlsprobe"
          dir="$(mktemp -d)"; cd "$dir"
          openssl version | tee -a "$GITHUB_STEP_SUMMARY"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-384 -nodes -keyout ca.key -out ca.pem \
            -days 2 -subj "/CN=P5-S1 interop CA" -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign"
          openssl x509 -in ca.pem -outform DER -out ca.der
          ext="basicConstraints=critical,CA:FALSE
          subjectAltName=DNS:localtest.kai
          extendedKeyUsage=serverAuth"
          leaf() {
            openssl req -new -newkey "$1" $2 -nodes -keyout "$3.key" -subj "/CN=localtest.kai" -out "$3.csr"
            openssl x509 -req -in "$3.csr" -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
              -extfile <(echo "$ext") -out "$3.pem"
          }
          leaf ec "-pkeyopt ec_paramgen_curve:P-256" ec
          leaf rsa:2048 "" rsa
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for run in "ec TLS_AES_128_GCM_SHA256 X25519" "ec TLS_AES_256_GCM_SHA384 P-384" \
                     "ec TLS_CHACHA20_POLY1305_SHA256 P-256" "rsa TLS_AES_128_GCM_SHA256 X25519"; do
            set -- $run
            openssl s_server -accept 127.0.0.1:4433 -cert "$1.pem" -key "$1.key" -tls1_3 \
              -ciphersuites "$2" -groups "$3" -www -naccept 1 < /dev/null > server.log 2>&1 &
            sleep 1
            "$probe" --root ca.der localtest.kai:4433@127.0.0.1:4433 | tee -a "$GITHUB_STEP_SUMMARY"
            wait
          done
          # Refused: the interop CA is not among Mozilla's roots.
          openssl s_server -accept 127.0.0.1:4433 -cert ec.pem -key ec.key -tls1_3 -www -naccept 1 \
            < /dev/null > server.log 2>&1 &
          sleep 1
          if "$probe" localtest.kai:4433@127.0.0.1:4433 | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "an unknown CA was accepted"; exit 1
          fi
          kill %1 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  real-hosts:
    name: P5-S1 the four real hosts (TLS 1.3, read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: p5-s1-host
          save-if: false
      - name: Handshake with github.com, the Pages host, release-assets.githubusercontent.com and huggingface.co
        run: |
          set -o pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo run --release -p spike-tls --features std --bin tlsprobe | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  boot:
    name: P5-S1 tls-bench (KVM, release, opt-level ${{ matrix.opt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        opt: ["3", "s"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qemu
      - name: The runner's CPU
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | grep -o -w -E 'aes|pclmulqdq|avx2|rdrand|rdseed' | xargs echo
      - name: Allow KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: p5-s1-boot-${{ matrix.opt }}
      - name: Boot test=tls-bench and keep its figures
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt }}
          XTASK_CASE: tls-bench
        run: |
          set -o pipefail
          cargo xtask test --release --accel kvm --timeout 600 2>&1 | tee boot.log
          {
            echo "opt-level ${{ matrix.opt }} (\"s\" keeps the provider and AEAD crates at 3):"
            echo '```'
            grep -E 'tls-bench:' boot.log | sed 's/^ *| //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
