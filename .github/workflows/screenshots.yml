name: Screenshots

# The desktop tour for people to look at, not a gate: boots `desk-tour`
# (xtask/src/cases/tour.rs) under KVM with the mock model, takes a QEMU
# screendump at each step, and uploads them as PNGs (01-desktop.png and on) in
# one artifact. Run by hand, or on a PR by adding the `screenshots` label (a
# hand run needs this file on main first).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tour:
    name: Desktop tour
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'screenshots'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qemu
      - name: Allow KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the WebAssembly target for live components
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: qemu
          save-if: false
      - name: Boot the tour and take its screendumps
        env:
          XTASK_CASE: desk-tour
        run: cargo xtask test --accel kvm --timeout 600
      - name: Convert the screendumps to PNG
        if: always()
        shell: python3 -I {0}
        run: |
          # target/tour-<step>.ppm (binary P6, 8-bit) to screenshots/<step>.png,
          # with the standard library alone.
          import pathlib, struct, zlib

          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body))

          out = pathlib.Path("screenshots")
          out.mkdir(exist_ok=True)
          for ppm in sorted(pathlib.Path("target").glob("tour-*.ppm")):
              raw = ppm.read_bytes()
              fields, at = [], 0
              while len(fields) < 4:
                  while raw[at:at + 1].isspace():
                      at += 1
                  start = at
                  while not raw[at:at + 1].isspace():
                      at += 1
                  fields.append(raw[start:at].decode())
              assert fields[0] == "P6" and fields[3] == "255", (ppm, fields)
              width, height = int(fields[1]), int(fields[2])
              pixels = raw[at + 1:]
              stride = width * 3
              rows = b"".join(b"\0" + pixels[y * stride:(y + 1) * stride] for y in range(height))
              png = b"\x89PNG\r\n\x1a\n"
              png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
              png += chunk(b"IDAT", zlib.compress(rows, 9))
              png += chunk(b"IEND", b"")
              name = ppm.stem.removeprefix("tour-") + ".png"
              (out / name).write_bytes(png)
              print(f"{name}: {width}x{height}")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desk-tour
          path: screenshots/
          if-no-files-found: warn
