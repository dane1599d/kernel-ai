[package]
name = "probe-guest"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

# Built alone for wasm32-unknown-unknown by the oracle tests.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
