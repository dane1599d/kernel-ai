# Spike S03-1 "same bytes, two engines" (ADR 0003), the lean host part. Its own
# workspace, so Wasmtime never enters the main Cargo.lock or CI's usual jobs.
[workspace]
resolver = "3"
members = ["appabi", "oracle"]
exclude = ["guest"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"

[profile.dev.package."*"]
opt-level = 2
