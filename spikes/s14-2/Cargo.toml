[package]
name = "spike-wasmtime-nostd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
test = false

# S14-2 (throwaway, spike/wasmtime-nostd, never merged): Wasmtime's runtime
# alone, no_std, no compiler. It loads a `.cwasm` made ahead of time, for
# Pulley (the interpreter) in this first step: native code needs a call that
# maps memory read-execute, which the kernel does not have.
[dependencies]
wasmtime = { version = "51.0.0", default-features = false, features = ["runtime", "pulley"] }
