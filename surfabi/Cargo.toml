[package]
name = "surfabi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# `kai-surface 1`, the window protocol between apps and `desktop` (ADR 0005 §3):
# the wire, the objects, the per-surface header page and the accessibility tree
# records. No system calls, so all of it is tested on the host.
[lib]
doctest = false

[dependencies]
kabi = { path = "../kabi" }
