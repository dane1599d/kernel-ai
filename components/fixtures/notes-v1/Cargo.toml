[package]
name = "comp-notes-v1"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Version 1 of the `notes` component, kept as a fixture: the version the live one
# migrates from.
[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
compsdk = { path = "../../../compsdk" }
minicbor = { version = "2.3.0", default-features = false, features = ["alloc", "derive"] }
