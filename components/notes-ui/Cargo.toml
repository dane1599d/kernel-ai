[package]
name = "comp-notes-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Notes' window as a `kai:ui` tree (ADR 0005 section 4), kept out of
# `comp-notes` so the source the edit loop changes is untouched.
[lib]
doctest = false

[dependencies]
comp-notes = { path = "../notes", default-features = false }
compsdk = { path = "../../compsdk" }
uikit = { path = "../../uikit" }

[dev-dependencies]
gfx2d = { path = "../../gfx2d" }
look = { path = "../../look" }
sha2 = "0.11.1"
uipaint = { path = "../../uipaint" }
deskcore = { path = "../../deskcore" }
surfabi = { path = "../../surfabi" }
wasmhost = { path = "../../wasmhost" }
